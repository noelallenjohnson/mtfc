    <text x="266" y="596">Producers · fiber · inputs</text><text x="1334" y="596">Investors · end users</text>
  </g>
  <!-- power chips: label + three-step meter -->
  <g font-size="21" font-weight="600" letter-spacing="2">
    <g transform="translate(800,282)"><text x="-58" y="8" fill="#8f6a32">POWER · HIGH</text><g transform="translate(62,-9)"><rect width="26" height="18" rx="4" fill="#a67c3d"/><rect x="32" width="26" height="18" rx="4" fill="#a67c3d"/><rect x="64" width="26" height="18" rx="4" fill="#a67c3d"/></g></g>
    <g transform="translate(800,1032)"><text x="-58" y="8" fill="#8f6a32">POWER · LOW</text><g transform="translate(56,-9)"><rect width="26" height="18" rx="4" fill="#a67c3d"/><rect x="32" width="26" height="18" rx="4" fill="#e2ded6"/><rect x="64" width="26" height="18" rx="4" fill="#e2ded6"/></g></g>
    <g transform="translate(256,664)"><text x="-52" y="8" fill="#8f6a32">POWER · MEDIUM</text><g transform="translate(74,-9)"><rect width="26" height="18" rx="4" fill="#a67c3d"/><rect x="32" width="26" height="18" rx="4" fill="#a67c3d"/><rect x="64" width="26" height="18" rx="4" fill="#e2ded6"/></g></g>
    <g transform="translate(1334,664)"><text x="-58" y="8" fill="#8f6a32">POWER · HIGH</text><g transform="translate(62,-9)"><rect width="26" height="18" rx="4" fill="#a67c3d"/><rect x="32" width="26" height="18" rx="4" fill="#a67c3d"/><rect x="64" width="26" height="18" rx="4" fill="#a67c3d"/></g></g>
  </g>
