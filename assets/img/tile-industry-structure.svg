<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" font-family="Inter, system-ui, sans-serif" text-anchor="middle">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a67c3d"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a1a18" flood-opacity=".07"/></filter>
  </defs>
  <rect width="1600" height="1200" fill="#f4f1ea"/>
  <!-- arrows -->
  <g stroke="#a67c3d" stroke-width="7" fill="none" marker-end="url(#a)" stroke-linecap="round">
    <path d="M800,352 L800,424"/><path d="M800,848 L800,776"/><path d="M448,600 L556,600"/><path d="M1152,600 L1044,600"/>
  </g>
  <!-- centre -->
