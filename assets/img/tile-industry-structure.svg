  <text x="800" y="500" font-size="22" font-weight="600" letter-spacing="3" fill="#c99a5c">MASS TIMBER INDUSTRY</text>
  <g font-size="33" font-weight="500" fill="#f7f6f3">
    <text x="800" y="566">Rivalries</text><text x="800" y="612">Collaborations</text><text x="800" y="658">Concentrations</text>
    <text x="800" y="704" font-size="30">Regulators · Economy</text>
  </g>
  <!-- outer cards -->
  <g filter="url(#s)" fill="#ffffff" stroke="#e2ded6" stroke-width="2">
    <rect x="570" y="112" width="460" height="226" rx="20"/>
    <rect x="570" y="862" width="460" height="226" rx="20"/>
    <rect x="96" y="474" width="340" height="252" rx="20"/>
    <rect x="1164" y="474" width="340" height="252" rx="20"/>
