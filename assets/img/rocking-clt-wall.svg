<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 1080" role="img" aria-labelledby="ttl dsc" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Resilient Structure: Rocking CLT Shear Wall Design (animated)</title>
  <desc id="dsc">An eight-story building with two post-tensioned cross-laminated timber rocking walls shown through the facade. The gravity frame racks gently side to side while the walls rock as rigid panels at their base. A magnified detail shows the wall toe lifting, a replaceable energy dissipator stretching, and the tendon pulling the wall back to plumb.</desc>
  <defs>
    <style>
      .frame { transform-origin: 0 976px; animation: sway 7s ease-in-out infinite; }
      .wallL { transform-origin: 204px 976px; animation: rock 7s ease-in-out infinite; }
      .wallR { transform-origin: 356px 976px; animation: rock 7s ease-in-out infinite; }
      .zwall { transform-origin: 740px 790px; animation: rockZ 7s ease-in-out infinite; }
      .dL { transform-origin: 660px 790px; animation: stretchL 7s ease-in-out infinite; }
      .dR { transform-origin: 820px 790px; animation: stretchR 7s ease-in-out infinite; }
      .drift { animation: drift 7s ease-in-out infinite; }
      .shake { animation: shake 7s ease-in-out infinite; }
      @keyframes sway   { 0%,50%,100% { transform: skewX(0); }   25% { transform: skewX(-1.3deg); } 75% { transform: skewX(1.3deg); } }
      @keyframes rock   { 0%,50%,100% { transform: rotate(0); }  25% { transform: rotate(1.3deg); } 75% { transform: rotate(-1.3deg); } }
      @keyframes rockZ  { 0%,50%,100% { transform: translateY(0) rotate(0); }
                          25% { transform: translateY(-4.9px) rotate(4deg); }
                          75% { transform: translateY(-4.9px) rotate(-4deg); } }
      @keyframes stretchL { 0%,50%,75%,100% { transform: scaleY(1); } 25% { transform: scaleY(1.33); } }
      @keyframes stretchR { 0%,25%,50%,100% { transform: scaleY(1); } 75% { transform: scaleY(1.33); } }
      @keyframes drift  { 0%,50%,100% { transform: translateX(0); } 25% { transform: translateX(14px); } 75% { transform: translateX(-14px); } }
      @keyframes shake  { 0%,50%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
      @media (prefers-reduced-motion: reduce) {
        .frame, .wallL, .wallR, .zwall, .dL, .dR, .drift, .shake { animation: none; }
      }
      .lbl  { font-size: 14px; font-weight: 700; fill: #1f2937; }
      .sub  { font-size: 12px; fill: #4b5563; }
      .tiny { font-size: 11px; fill: #6b7280; }
    </style>
    <g id="win">
      <rect width="56" height="82" fill="#a8c5e7" stroke="#22334d" stroke-width="2"/>
      <rect x="2" y="2" width="52" height="12" fill="#cadcf1"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <clipPath id="insetClip"><circle cx="740" cy="760" r="140"/></clipPath>
  </defs>

  <rect x="0" y="0" width="920" height="1080" fill="#ffffff"/>
  <!-- ground -->
  <rect x="0" y="976" width="920" height="104" fill="#edeae4"/>
  <line x1="0" y1="976" x2="920" y2="976" stroke="#6b7280" stroke-width="2"/>

  <!-- footings and tendon anchorages -->
  <g>
    <rect x="156" y="976" width="96" height="40" fill="#aeb5bd" stroke="#6b7280" stroke-width="1.5"/>
    <rect x="308" y="976" width="96" height="40" fill="#aeb5bd" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="204" y1="976" x2="204" y2="1008" stroke="#c2410c" stroke-width="3"/>
    <line x1="356" y1="976" x2="356" y2="1008" stroke="#c2410c" stroke-width="3"/>
    <rect x="194" y="1006" width="20" height="6" fill="#374151"/>
    <rect x="346" y="1006" width="20" height="6" fill="#374151"/>
  </g>

  <!-- gravity frame + facade: racks with the drift -->
  <g class="frame">
    <rect x="80" y="80" width="400" height="896" fill="#d4e2f4" stroke="#1e2b3d" stroke-width="3"/>
    <g stroke="#b7c8dd" stroke-width="1.5"><line x1="80" y1="188" x2="480" y2="188"/><line x1="80" y1="296" x2="480" y2="296"/><line x1="80" y1="404" x2="480" y2="404"/><line x1="80" y1="512" x2="480" y2="512"/><line x1="80" y1="620" x2="480" y2="620"/><line x1="80" y1="728" x2="480" y2="728"/><line x1="80" y1="836" x2="480" y2="836"/></g>
    <g>
      <use xlink:href="#win" x="100" y="93"/>
      <use xlink:href="#win" x="176" y="93"/>
      <use xlink:href="#win" x="252" y="93"/>
      <use xlink:href="#win" x="328" y="93"/>
      <use xlink:href="#win" x="404" y="93"/>
      <use xlink:href="#win" x="100" y="201"/>
      <use xlink:href="#win" x="176" y="201"/>
      <use xlink:href="#win" x="252" y="201"/>
      <use xlink:href="#win" x="328" y="201"/>
      <use xlink:href="#win" x="404" y="201"/>
      <use xlink:href="#win" x="100" y="309"/>
      <use xlink:href="#win" x="176" y="309"/>
      <use xlink:href="#win" x="252" y="309"/>
      <use xlink:href="#win" x="328" y="309"/>
      <use xlink:href="#win" x="404" y="309"/>
      <use xlink:href="#win" x="100" y="417"/>
      <use xlink:href="#win" x="176" y="417"/>
      <use xlink:href="#win" x="252" y="417"/>
      <use xlink:href="#win" x="328" y="417"/>
      <use xlink:href="#win" x="404" y="417"/>
      <use xlink:href="#win" x="100" y="525"/>
      <use xlink:href="#win" x="176" y="525"/>
      <use xlink:href="#win" x="252" y="525"/>
      <use xlink:href="#win" x="328" y="525"/>
      <use xlink:href="#win" x="404" y="525"/>
      <use xlink:href="#win" x="100" y="633"/>
      <use xlink:href="#win" x="176" y="633"/>
      <use xlink:href="#win" x="252" y="633"/>
      <use xlink:href="#win" x="328" y="633"/>
      <use xlink:href="#win" x="404" y="633"/>
      <use xlink:href="#win" x="100" y="741"/>
      <use xlink:href="#win" x="176" y="741"/>
      <use xlink:href="#win" x="252" y="741"/>
      <use xlink:href="#win" x="328" y="741"/>
      <use xlink:href="#win" x="404" y="741"/>
    </g>
    <!-- ground floor storefront -->
    <g>
      <rect x="100" y="850" width="108" height="116" fill="#a8c5e7" stroke="#22334d" stroke-width="2"/>
      <rect x="226" y="850" width="108" height="116" fill="#a8c5e7" stroke="#22334d" stroke-width="2"/>
      <rect x="352" y="850" width="108" height="116" fill="#a8c5e7" stroke="#22334d" stroke-width="2"/>
      <rect x="102" y="852" width="104" height="12" fill="#cadcf1"/>
      <rect x="228" y="852" width="104" height="12" fill="#cadcf1"/>
      <rect x="354" y="852" width="104" height="12" fill="#cadcf1"/>
      <rect x="262" y="892" width="36" height="74" fill="#5f7fa6" stroke="#22334d" stroke-width="2"/>
    </g>
    <rect x="74" y="68" width="412" height="14" fill="#2f3e52"/>
  </g>

  <!-- rocking walls, shown through the facade -->
  <g class="wallL">
    <rect x="168" y="82" width="72" height="894" fill="#e6eaef" fill-opacity="0.86" stroke="#4b5a6b" stroke-width="2.5"/>
    <g stroke="#cfd6de" stroke-width="1"><line x1="180" y1="84" x2="180" y2="974"/><line x1="192" y1="84" x2="192" y2="974"/><line x1="216" y1="84" x2="216" y2="974"/><line x1="228" y1="84" x2="228" y2="974"/></g>
    <line x1="204" y1="60" x2="204" y2="976" stroke="#c2410c" stroke-width="3"/>
    <rect x="190" y="58" width="28" height="10" fill="#374151"/>
  </g>
  <g class="wallR">
    <rect x="320" y="82" width="72" height="894" fill="#e6eaef" fill-opacity="0.86" stroke="#4b5a6b" stroke-width="2.5"/>
    <g stroke="#cfd6de" stroke-width="1"><line x1="332" y1="84" x2="332" y2="974"/><line x1="344" y1="84" x2="344" y2="974"/><line x1="368" y1="84" x2="368" y2="974"/><line x1="380" y1="84" x2="380" y2="974"/></g>
    <line x1="356" y1="60" x2="356" y2="976" stroke="#c2410c" stroke-width="3"/>
    <rect x="342" y="58" width="28" height="10" fill="#374151"/>
  </g>

  <!-- energy dissipators at the wall toes -->
  <g fill="#ea7a1f">
    <rect x="158" y="960" width="10" height="18" rx="2"/><rect x="240" y="960" width="10" height="18" rx="2"/>
    <rect x="310" y="960" width="10" height="18" rx="2"/><rect x="392" y="960" width="10" height="18" rx="2"/>
  </g>

  <g class="tiny" text-anchor="end"><text x="70" y="138">8</text><text x="70" y="246">7</text><text x="70" y="354">6</text><text x="70" y="462">5</text><text x="70" y="570">4</text><text x="70" y="678">3</text><text x="70" y="786">2</text><text x="70" y="910">1</text></g>

  <text x="80" y="34" font-size="22" font-weight="700" fill="#1f2937">Resilient Structure: Rocking CLT Shear Wall Design</text>
  <text x="80" y="54" class="sub">Post-tensioned, self-centering lateral system in an 8-story building (motion exaggerated)</text>

  <g class="drift">
    <line x1="502" y1="75" x2="556" y2="75" stroke="#4b5563" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <text x="566" y="79" class="sub">sway</text>

  <!-- callouts -->
  <g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="394" y1="240" x2="504" y2="240"/>
    <line x1="360" y1="410" x2="504" y2="410"/>
    <line x1="470" y1="530" x2="504" y2="530"/>
    <line x1="392" y1="978" x2="614" y2="812"/>
  </g>
  <text x="512" y="236" class="lbl">CLT rocking wall</text>
  <text x="512" y="254" class="sub">rigid panel that pivots at its base</text>
  <text x="512" y="406" class="lbl">Post-tensioned tendon</text>
  <text x="512" y="424" class="sub">clamps the wall down and re-centers it</text>
  <text x="512" y="526" class="lbl">Gravity frame</text>
  <text x="512" y="544" class="sub">racks with the drift; the walls carry the lateral load</text>
  <text x="82" y="1000" class="sub">Foundation</text>
  <line x1="148" y1="996" x2="156" y2="996" stroke="#6b7280" stroke-width="1.5"/>

  <g class="shake">
    <line x1="100" y1="1042" x2="220" y2="1042" stroke="#4b5563" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <text x="232" y="1046" class="sub">ground motion</text>

  <!-- magnified detail of the wall base -->
  <circle cx="740" cy="760" r="140" fill="#f8fafc"/>
  <g clip-path="url(#insetClip)">
    <rect x="600" y="790" width="280" height="120" fill="#aeb5bd"/>
    <line x1="600" y1="790" x2="880" y2="790" stroke="#6b7280" stroke-width="2"/>
    <line x1="740" y1="790" x2="740" y2="840" stroke="#c2410c" stroke-width="4"/>
    <rect x="726" y="838" width="28" height="8" fill="#374151"/>
    <g class="zwall">
      <rect x="670" y="610" width="140" height="180" fill="#e6eaef" stroke="#4b5a6b" stroke-width="3"/>
      <g stroke="#cfd6de" stroke-width="1.5"><line x1="694" y1="612" x2="694" y2="788"/><line x1="717" y1="612" x2="717" y2="788"/><line x1="763" y1="612" x2="763" y2="788"/><line x1="786" y1="612" x2="786" y2="788"/></g>
      <line x1="740" y1="610" x2="740" y2="790" stroke="#c2410c" stroke-width="4"/>
    </g>
    <g class="dL" fill="#ea7a1f"><rect x="646" y="760" width="16" height="30" rx="3"/><rect x="646" y="754" width="26" height="8" rx="2"/></g>
    <g class="dR" fill="#ea7a1f"><rect x="818" y="760" width="16" height="30" rx="3"/><rect x="808" y="754" width="26" height="8" rx="2"/></g>
  </g>
  <circle cx="740" cy="760" r="140" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="748" y="648" font-size="12" fill="#c2410c" font-weight="700">tendon</text>
  <text x="608" y="742" class="tiny">dissipator</text>
  <text x="872" y="742" class="tiny" text-anchor="end">dissipator</text>
  <text x="740" y="870" font-size="12" fill="#f8fafc" text-anchor="middle">foundation</text>

  <text x="880" y="928" class="lbl" text-anchor="end">Wall base, magnified</text>
  <text x="880" y="946" class="sub" text-anchor="end">The wall lifts at one toe; the dissipator yields and absorbs energy;</text>
  <text x="880" y="962" class="sub" text-anchor="end">the tendon pulls it back down, so the building re-centers.</text>
</svg>
