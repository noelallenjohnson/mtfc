# Copy for the Industry Perceptions of Value Creation page.
# Each item is one paragraph. Edit the indented line under ">-" and commit.
# Chart numbers come from assets/js/ip-data.js, not from this file,
# except the two "in their own words" charts, whose counts are below.

status: >-
  Survey results released for public review
byline: >-
  Noel Johnson, Conrad / Old i, LLC
supporters: >-
  Mass Timber Group

summary: >-
  What does the mass timber industry believe its customers value in its products? Survey answers from 67 experienced, committed industry professionals - to set a perceptions baseline for comparision.

why:
  - >-
    People who design, build and supply mass timber buildings must sell how the material creates value.  Explanations vary, and are challenged by a lack of research on their product's end users. This page explores the industry's current perceptions.
  - >-
    The sample set is derived from attendees of the Mass Timber Group Summits in Denver in August 2025 and August 2026. This conference is focused on more experienced industry leaders - those who have worked on more than one completed mass timber project. All are comparatively committed; as evidenced by their spending time and money to be there. Thus, this is the group whose perceptions set the industry's tone.
  - >-
    Each person rated a list of possible sources of value as highly valued, of interest, or not mentioned. The question was put in two deliberately different ways: what clients said drove their choice of mass timber, and how end users (occupants, investors, politicians) would rank the same themes.

who:
  heading: >-
    Who answered
  text: >-

ratings:
  heading: >-
    What the industry believes is valued
  text: >-
    The solid colors show the share of respondents who rated an attribute of mass timber as being highly valued by the consumer. The pale colors denotes those who suggest the attribute is "of interest", and the grey reflects what is not percieved to "not be mentioned". Colour shows where the theme sits, as a demand, supply, or socio-political themed attribute.
  caption: >-
    Hover over or tap a bar for the counts. Groups are small, so read differences between them as directional. "Interiors smell like forest" was added in the second round, so 23 people rated it.

taxonomy:
  heading: >-
    Mapped to a simple taxonomy
  text: >-
    Real estate separates assets driven by supply and demand from those shaped by socio-political forces. Sorting each "highly valued" rating by the class of its theme shows where the industry places mass timber's value. Demand and supply together are market drivers. Socio-political themes are non-market drivers.
  caption: >-
    Share of all "highly valued" ratings, pooled. The classes hold different numbers of themes, so the average share of respondents rating each theme highly valued is shown beside each class.

words:
  heading: >-
    In their own words
  text: >-
    Opportunity for open answers were mapped to their themes; some to more than one theme.
  value:
    title: >-
      "What are one or two of the most important ways mass timber creates value?"
    n: 22
    note: >-
      22 answers. Asked in the first round.
    items:
      - { label: "Sustainability, decarbonization, renewable material", count: 10, cls: P }
      - { label: "Beauty, aesthetics, design quality", count: 8, cls: D }
      - { label: "Biophilia, health, how the space feels", count: 8, cls: D }
      - { label: "Speed, prefabrication, construction efficiency", count: 8, cls: S }
      - { label: "Market differentiation, premium, faster absorption", count: 4, cls: D }
      - { label: "Fire and code solutions, resilience", count: 3, cls: P }
      - { label: "Local sourcing, forests, rural economy", count: 3, cls: P }
      - { label: "Access to investors, funding or approvals", count: 2, cls: P }
  pushback:
    title: >-
      "What pushback do you hear from others on your development's use of mass timber?"
    n: 25
    note: >-
      25 answers that named an objection. One further respondent reported none. Asked in the second round.
    items:
      - { label: "Cost: a premium, uncertain cost, or it does not pencil", count: 21, cls: N }
      - { label: "Unfamiliarity: contractors, building departments, partners, the product itself", count: 10, cls: N }
      - { label: "Risk, insurance and lender confusion", count: 3, cls: N }
      - { label: "Acoustics", count: 2, cls: N }
      - { label: "Schedule and timing", count: 2, cls: N }
      - { label: "Transport and logistics", count: 1, cls: N }

findings:
  heading: >-
    Findings
  points:
    - title: >-
        Beauty is believed to be the number one value creating attributes
      text: >-
    - title: >-
        Construction speed, wellbeing and aesthetic differentition are tier two value creation mechanisms
      text: >-
    - title: >-
        Perceived value is both market and non-market in nature
      text: >-
    - title: >-
        Attributes advancing public policy themes rank lowest
      text: >-
    - title: >-
        Open comment replies focus on the value of sustainability, and the challenges of cost
      text: >-

reflections:
  heading: >-
    Reflections
  text:
    - >-
      Research on mass timber consumers is scarce. Two studies known to exist offer initila comparisons to fuel informed discussions of how the industry should market its products and projects. [Underwriting Mass Timber Apartments](/household-valuation-of-mass-timber) (Johnson, Angle and Esarey, 2026) surveyed 26 household at two exposed mass timber developments in Portland, Oregon. [Consumer housing choices among residents living in wooden multi-storey buildings](https://doi.org/10.1080/02673037.2023.2217765) (Jussila et al., 2023) interviewed seven households in five non-exposed developments across Finland and Sweden.
    - >-
      Both are small and directional; nonetheless, divergences from the industry's understanding of its customers can be detected.
  points:
    - title: >-
        The industry is right about beauty and wellbeing
      text: >-
        Beauty leads by a wide margin, and biophilic or health benefits rank third. The renter study found the same mechanisms at work: beauty, architectural differentiation and feelings of calm. The Finnish and Swedish residents likewise experienced the wood as mainly positive, judged together with the building's overall aesthetics.
    - title: >-
        It may be wrong about how that value is paid
      text: >-
        In their own words, several respondents (4 of 22) described the benefit as a premium: higher rents, higher prices, faster absorption. But the renters studied did not pay more.
    - title: >-
        Sustainability is an industry interest more than the consumer's consideration 
      text: >-
        Sustainability was the most common theme when respondents answered in their own words. The renter study found little consumer-created value from credence attributes such as carbon footprint, local manufacture or heritage. In Finland and Sweden, neither the building material nor sustainability triggered residents' initial interest; location, floor plan and affordability guided the choice.
    - title: >-
        Whose value is construction speed?
      text: >-
        Faster on-site construction ranks second only to beauty. Speed matters to the developer and the investor only if it produces a shorter total duration of investment; occupants have no reason to care about it. On this theme, any value created via speed is engodenous to the industry's competitiveness.
    - title: >-
        A large share of the perceived value sits outside the market
      text: >-
        More than a third of the "highly valued" ratings went to socio-political themes. Market-rate capital underwrites to comparables set by supply and demand. Value that resonsates with policy goals must be paid by the governments who set them.
   
        
method:
  heading: >-
    Method and limits
  points:
    - >-
      The survey was run in Qualtrics in two rounds at the Mass Timber Group Summit in Denver, in August 2025 and August 2026. Results from the two rounds are pooled.
    - >-
      Respondents chose to attend and chose to answer. The results describe informed, experienced and committed industry participants. They do not describe the industry as a whole, and they do not describe consumers.
    - >-
      Partial responses are used wherever a question was answered, so the number of answers differs between charts: 67 people took part, 55 described their background and 46 completed the ratings.
    - >-
      The two rounds worded the rating question differently on purpose. One asked about clients' stated reasons for choosing mass timber. The other asked respondents to take the end user's point of view. Both aim at the same thing.
    - >-
      Some questions were asked in one round only: the nature of the respondent's work, the two open questions, and the theme "Interiors smell like forest".
    - >-
      The assignment of themes to demand, supply and socio-political classes is the author's. Two themes, structural ability and on-shore supply chain, could reasonably be classed as supply.
    - >-
      Open answers were grouped into themes by the author. Individual replies are kept private, as respondents were promised.

