# Copy for the Industry Perceptions of Value Creation page.
# Each item is one paragraph. Edit the indented line under ">-" and commit.
# Chart numbers come from assets/js/ip-data.js, not from this file,
# except the two "in their own words" charts, whose counts are below.

status: >-
  Survey results released for public review
byline: >-
  Noel Johnson, Conrad / Old i, LLC
supporters: >-
  Mass Timber Group, which facilitated distribution of the survey as host of its Summit

summary: >-
  What does the supply side of mass timber believe its customers value? Survey answers from 67 experienced, committed industry professionals set a baseline of current leading perceptions, so they can be compared with what consumer research finds.

why:
  - >-
    People who design, build, supply and finance mass timber buildings explain every day why the material creates value. Their explanations vary, and they are rarely checked against the people who rent, buy or occupy the buildings. This page records what the industry currently believes.
  - >-
    The respondents attended the Mass Timber Group Summit in Denver in August 2025 and August 2026. Most have worked on more than one completed mass timber project, and all spent time and money to be there. They are not a random sample of the industry. They are its informed and committed end, which is the group whose perceptions set the tone.
  - >-
    Each person rated a list of possible sources of value as highly valued, of interest, or not mentioned. The question was put in two deliberately different ways: what clients said drove their choice of mass timber, and how end users (occupants, investors, politicians) would rank the same themes. The answers are pooled here. The page belongs with the consumer-focused work because its subject is the supply side's picture of demand, including where that picture may be wrong.

who:
  heading: >-
    Who answered
  text: >-
    67 people took part across two rounds of the survey. Not everyone answered every question: 55 described their background and 46 completed the ratings. One person took part in both rounds and is counted both times. Each chart states the number of answers behind it.

ratings:
  heading: >-
    What the industry believes is valued
  text: >-
    Each bar is one theme. The solid part is the share of respondents who rated it highly valued, the pale part "of interest", and the grey part "not mentioned". Colour shows where the theme sits in the proposed taxonomy: demand, supply, or socio-political. Change the group of respondents to see what moves.
  caption: >-
    Hover over or tap a bar for the counts. Groups are small, so read differences between them as directional. "Interiors smell like forest" was added in the second round, so 23 people rated it.

taxonomy:
  heading: >-
    Mapped to a simple taxonomy
  text: >-
    Real estate separates assets driven by supply and demand from those shaped by socio-political forces. Sorting each "highly valued" rating by the class of its theme shows where the industry places mass timber's value. Demand and supply together are market drivers. Socio-political themes are non-market drivers.
  caption: >-
    Share of all "highly valued" ratings, pooled. The classes hold different numbers of themes, so the average share of respondents rating each theme highly valued is shown beside each class.

words:
  heading: >-
    In their own words
  text: >-
    Open answers are reported as themes, never as individual replies. An answer can touch more than one theme.
  value:
    title: >-
      "What are one or two of the most important ways mass timber creates value?"
    n: 22
    note: >-
      22 answers. Asked in the first round.
    items:
      - { label: "Sustainability, decarbonization, renewable material", count: 10, cls: P }
      - { label: "Beauty, aesthetics, design quality", count: 8, cls: D }
      - { label: "Biophilia, health, how the space feels", count: 8, cls: D }
      - { label: "Speed, prefabrication, construction efficiency", count: 8, cls: S }
      - { label: "Market differentiation, premium, faster absorption", count: 4, cls: D }
      - { label: "Fire and code solutions, resilience", count: 3, cls: P }
      - { label: "Local sourcing, forests, rural economy", count: 3, cls: P }
      - { label: "Access to investors, funding or approvals", count: 2, cls: P }
  pushback:
    title: >-
      "What pushback do you hear from others on your development's use of mass timber?"
    n: 25
    note: >-
      25 answers that named an objection. One further respondent reported none. Asked in the second round.
    items:
      - { label: "Cost: a premium, uncertain cost, or it does not pencil", count: 21, cls: N }
      - { label: "Unfamiliarity: contractors, building departments, partners, the product itself", count: 10, cls: N }
      - { label: "Risk, insurance and lender confusion", count: 3, cls: N }
      - { label: "Acoustics", count: 2, cls: N }
      - { label: "Schedule and timing", count: 2, cls: N }
      - { label: "Transport and logistics", count: 1, cls: N }

discussion:
  heading: >-
    Points for discussion
  text: >-
    Read against the first consumer evidence, the baseline shows where the industry's picture of demand holds up and where it may not. The renter findings are from [Underwriting Mass Timber Apartments](/household-valuation-of-mass-timber), a study of 26 renters at two exposed mass timber developments in Portland, and are directional.
  points:
    - title: >-
        The industry is right about beauty and wellbeing
      text: >-
        Beauty leads by a wide margin (35 of 46 rated it highly valued), and biophilic or health benefits rank third (24 of 46). The renter study found the same mechanisms at work: beauty, architectural differentiation and feelings of calm.
    - title: >-
        It may be wrong about how that value is paid
      text: >-
        In their own words, several respondents (4 of 22) described the benefit as a premium: higher rents, higher prices, faster absorption. The renters studied did not pay more. The value appeared as longer stays, on-time payment and strong credit. That is retention and credit loss in the proforma, not rent.
    - title: >-
        Sustainability is the industry's story more than the consumer's
      text: >-
        Sustainability and decarbonization was the most common theme when respondents answered in their own words (10 of 22), and 16 of 46 rated decarbonization highly valued. The renter study found little consumer-created value from credence attributes such as carbon footprint, local manufacture or heritage.
    - title: >-
        Whose value is construction speed?
      text: >-
        Faster on-site construction ranks second only to beauty (29 of 46 rated it highly valued). Speed matters to the developer and the investor. An occupant never experiences it. The answer suggests that "the customer" is not one person in the industry's mind.
    - title: >-
        A large share of the perceived value sits outside the market
      text: >-
        Socio-political themes drew 36% of the "highly valued" ratings. Market-rate capital underwrites to comparables set by supply and demand. Value that depends on policy, approvals or public goodwill is harder to underwrite and does not travel from one project to the next.
    - title: >-
        The industry is unsure that timber stimulates demand
      text: >-
        "Stimulate consumer demand" was rated highly valued by 16 of 46, less than half the number for beauty. Respondents believe people find the buildings beautiful without being confident that beauty turns into demand. That gap is what consumer research can close.
    - title: >-
        The objection is cost, and nobody mentioned the consumer
      text: >-
        Of 25 respondents who named the pushback they hear, 21 named cost and 10 named unfamiliarity. None reported doubt about whether residents or tenants want the product. The debate inside the industry is about the denominator, the cost to build, while the evidence on the numerator, what occupants value, is only starting to arrive.

method:
  heading: >-
    Method and limits
  points:
    - >-
      The survey was run in Qualtrics in two rounds at the Mass Timber Group Summit in Denver, in August 2025 and August 2026. Results from the two rounds are pooled.
    - >-
      Respondents chose to attend and chose to answer. The results describe informed, experienced and committed industry participants. They do not describe the industry as a whole, and they do not describe consumers.
    - >-
      Partial responses are used wherever a question was answered, so the number of answers differs between charts: 67 people took part, 55 described their background and 46 completed the ratings.
    - >-
      The two rounds worded the rating question differently on purpose. One asked about clients' stated reasons for choosing mass timber. The other asked respondents to take the end user's point of view. Both aim at the same thing.
    - >-
      Some questions were asked in one round only: the nature of the respondent's work, the two open questions, and the theme "Interiors smell like forest".
    - >-
      The assignment of themes to demand, supply and socio-political classes is the author's. Two themes, structural ability and on-shore supply chain, could reasonably be classed as supply.
    - >-
      Open answers were grouped into themes by the author. Individual replies are kept private, as respondents were promised.

