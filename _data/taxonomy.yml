# Copy and classification for the Mass Timber Economic Taxonomy page.
# Each paragraph is one indented line under ">-". Edit the words and commit.
# In the "attributes" list: cls is S (search), E (experience) or C (credence);
# users lists who values it: O (occupants), I (investors), P (socio-political);
# src lists which work considered it: U (renter study), J (Jussila et al.), P (industry survey).
# In "projects": each row of "emphasis" is search, experience, credence, scored 0 to 3.
# Use na in place of a number where that end user is not marketed to on that kind of project.

status: >-
  Proposal released for public review
byline: >-
  Noel Johnson, Conrad / Old i, LLC

summary: >-
  Effective marketing sorts the claims made by an industry or product relative to their consumer's willingness to pay. Data-driven attribute assessment, coupled with a shared language for marketing, sales and product decisions, can drive growth.

why:
  - >-
    Mass timber is sold on many attributes at once: beauty, wellbeing, speed, carbon, rural jobs. They do not all create value in the same way or for the same party. Some sell themselves on sight. Some are only learned by living or working in the building. Some can never be checked by the buyer and are worth only what a trusted third party will attest.
  - >-
    This page borrows a well-established idea from information economics and applies it to mass timber. It then sorts the attributes considered by three pieces of work into the resulting classes: the renter study behind [Underwriting Mass Timber Apartments](/household-valuation-of-mass-timber), the Finnish and Swedish resident study by [Jussila et al.](https://doi.org/10.1080/02673037.2023.2217765), and the survey of [Industry Perceptions of Value Creation](/industry-perceptions-of-value-creation). The result is a proposed taxonomy for mass timber.

classes_heading: >-
  Three attribute classes
classes:
  - key: S
    name: >-
      Search
    test: >-
      Verified by inspection
    text: >-
      The buyer can see it on a tour or in a photograph. It sells itself and needs little marketing beyond getting people to tour it.
    pays: >-
      Pays through attention, differentiation and faster decisions.
  - key: E
    name: >-
      Experience
    test: >-
      Learned only through use
    text: >-
      The user finds out by living or working in the building, or by building it. It cannot be judged on a tour. It shows up later, in what people do: whether they stay, renew and pay.
    pays: >-
      Pays through behaviour over time: retention, renewals, reliability, feeling.
  - key: C
    name: >-
      Credence
    test: >-
      Verified by trusted "expert"
    text: >-
      The user has to be told, and has to believe it. Carbon, provenance and policy alignment are of this kind. They create value only when a trusted third party attests to them and when someone with a stake in the claim is paying.
    pays: >-
      Pays through trusted labels & certification, not through claims.
classes_source: >-
  Search and experience qualities follow Nelson (1970, 1974). Credence qualities follow Darby and Karni (1973).

users_heading: >-
  Three end users
users_text: >-
  The same attribute is worth different amounts to different parties. Three groups decide whether a mass timber building is worth more.
users:
  - key: O
    name: >-
      Occupants
    text: >-
      Residents, tenants, students, staff and visitors: the people inside the building.
  - key: I
    name: >-
      Investors
    text: >-
      Owners, lenders (those with savings): the parties who fund and bear its risk. Savings are mostly placed through investment firms with a fiduciary duty to seek the best risk-adjusted return.
  - key: P
    name: >-
      Socio-political
    text: >-
      Governments, NGOs, electorates: those focused on policy, regulations & approvals (public goods.)

kinds_heading: >-
  Three kinds of project
kinds_text: >-
  The building type does not decide the kind of project. What decides it is who pays for the building and what they answer to: the market, a mission, or the public.
kinds_note: >-
  The same building type can fall in different kinds. Student housing built by a private developer to earn rent is market-rate; built by the university for its own students, it is non-market institutional. A speculative office is market-rate; a headquarters a company builds for itself is non-market institutional; a city hall is public and civic.

tool:
  heading: >-
    A taxonomy tool
  text: >-
    A proposed, usable method. Start with the nature of the project. Pair it with an end user to see how much emphasis each attribute class deserves.
  caption: >-
    Block heights are the author's judgment of emphasis, from none to lead, informed by the three studies. They are a starting point for discussion, not a measurement.
  levels: ["Not a focus", "Minor", "Support", "Lead"]
  na: >-
    Not applicable
  na_text: >-
    No end user of this kind is being marketed to on this kind of project.
  steps:
    project: >-
      1 · Nature of the project
    user: >-
      2 · End user
    result: >-
      3 · Emphasis by attribute class
  labels:
    who: >-
      Who pays
    lead: >-
      Lead with
    shows: >-
      How the value shows up
    prove: >-
      Make it credible
    demote: >-
      Give less attention to

projects:
  - key: market
    name: >-
      Market-rate investment
    eg: >-
      Apartments, condominiums, offices: developer-initiated and bound by market comparables
    test: >-
      Answers to the market
    define: >-
      Built to earn a return from rents or sales. Private capital funds it, and its value is set by comparable properties.
    examples:
      - Market-rate apartments and condominiums
      - Speculative office and mixed-use buildings
      - Hotels and privately developed student housing
      - Industrial and logistics buildings
    emphasis:
      O: [3, 3, 1]
      I: [2, 3, 2]
      P: [na, na, na]
    na_note: >-
      Governments and neighbours are not marketed to on a market-rate project. Help with approvals and local opposition is counted under investors, because it lowers risk.
    who: >-
      Occupants, through what they do. Investors receive it as net operating income.
    lead: >-
      Search and experience attributes for occupants: visible wood, distinctive design, calm and wellbeing.
    shows: >-
      In the renter study, not as higher rent but as longer stays, lower turnover cost, on-time payment, stronger credit and less need for concessions or marketing. Pitch these as changes to NOI lines.
    prove: >-
      Keep the wood exposed and get prospects to tour. Use the asset's own retention and collections history once it exists.
    demote: >-
      Carbon, provenance and heritage stories, unless the submarket has a segment that values them and the building carries a recognised label.
  - key: nonmarket
    name: >-
      Non-market institutional
    eg: >-
      Universities, affordable housing, corporate and foundation headquarters
    test: >-
      Answers to a mission
    define: >-
      Built by an organization for its own purpose. It is funded by endowment, donors, subsidy or the organization's balance sheet, and judged against the mission, not against market comparables.
    examples:
      - University academic buildings and residence halls
      - Income-restricted affordable housing
      - Corporate and foundation headquarters built for the owner's own use
      - Nonprofit hospitals, museums and places of worship
    emphasis:
      O: [1, 3, 2]
      I: [1, 1, 3]
      P: [0, 1, 2]
    who: >-
      The institution, which is owner and occupier at once and answers to a mission, a board or funders.
    lead: >-
      Experience attributes for the people inside (wellbeing, calm) together with credence attributes that match the institution's stated mission: carbon, identity, cultural resonance, ESG mandates.
    shows: >-
      As mission delivery: recruitment and retention of staff or students, donor and funder appeal, compliance with the institution's own commitments.
    prove: >-
      Third-party certification, life-cycle assessments and chain-of-custody documents. The institution needs evidence it can show its own stakeholders.
    demote: >-
      Arguments built on market comparables or rent, which do not drive the decision.
  - key: public
    name: >-
      Public and civic
    eg: >-
      Libraries, schools, city halls, airports
    test: >-
      Answers to the public
    define: >-
      Built by a government or public agency with public money, through public procurement, to serve everyone and to advance adopted policy.
    examples:
      - Public libraries and schools
      - City halls, courthouses and fire stations
      - Airports and transit stations
      - Community and recreation centers
    emphasis:
      O: [2, 2, 1]
      I: [na, na, na]
      P: [1, 0, 3]
    na_note: >-
      Return-seeking investors are not marketed to on a public project. Voters act through the socio-political end user.
    who: >-
      A government or public agency, with public money. Elected leaders earn votes by building projects whose attributes align with what their voters support.
    lead: >-
      Credence attributes that align with policy: decarbonization, forest management, rural jobs, on-shore supply, resilience. A government that sets these goals should be willing to pay for them.
    shows: >-
      As progress against adopted policy, and as a building the public experiences as its own. Lower disruption during construction matters to neighbours.
    prove: >-
      Attestation the agency can cite: environmental product declarations, sourcing records, local employment figures, engineering review.
    demote: >-
      NOI arguments. There is no rent roll to move.

attributes_heading: >-
  The attributes, sorted
attributes_text: >-
  Attributes commonly considered at conferences, proposed for classification.
sources:
  U: >-
    Renter study
  J: >-
    Finland and Sweden study
  P: >-
    Industry survey
attributes:
  - { name: "Visible wood: beauty and aesthetics", cls: S, users: [O, I, P], src: [U, J, P], note: "Noticed at once by all 23 renters who toured in person. Rated highly valued by 35 of 46 industry respondents. Found appealing in Finland and Sweden, though not the trigger for choosing a home." }
  - { name: "Distinctive design and asset differentiation", cls: S, users: [O, I], src: [U, P], note: "Among the experiential mechanisms the renter study detected. Rated highly valued by 20 of 46 industry respondents." }
  - { name: "Marketing during construction", cls: S, users: [I], src: [P], note: "Rated highly valued by 9 of 46 industry respondents." }
  - { name: "Calm, health and wellbeing", cls: E, users: [O], src: [U, P], note: "24 of 26 renters agreed their home feels calmer. Rated highly valued by 24 of 46 industry respondents." }
  - { name: "Warmth and feel of natural material", cls: E, users: [O], src: [U, J], note: "Renters describe the wood in sensory and emotional terms. Residents in Finland and Sweden experienced the material as mainly positive." }
  - { name: "Interiors smell like forest", cls: E, users: [O], src: [P], note: "Rated highly valued by 4 of 23 industry respondents." }
  - { name: "Operating performance: retention, on-time payment, credit quality", cls: E, users: [I], src: [U], note: "Learned by owning the asset. In the renter study, residents stayed longer, paid on time and had strong credit, without paying more rent." }
  - { name: "Faster on-site construction", cls: E, users: [I], src: [P], note: "Rated highly valued by 29 of 46 industry respondents. Learned by building. It matters to an investor only if the whole investment period shortens." }
  - { name: "Smaller on-site workforce", cls: E, users: [I], src: [P], note: "Rated highly valued by 16 of 46 industry respondents." }
  - { name: "Better construction labor safety", cls: E, users: [I, P], src: [P], note: "Rated highly valued by 8 of 46 industry respondents." }
  - { name: "Less construction noise and dust", cls: E, users: [P, I], src: [P], note: "Experienced by neighbours. Rated highly valued by 10 of 46 industry respondents." }
  - { name: "Lower carbon, decarbonization, circular economy", cls: C, users: [P, I, O], src: [U, J, P], note: "Renters ranked it low and named it least important more often than other attributes; a minority values it and asks for a label. It did not trigger interest in Finland and Sweden. Rated highly valued by 16 of 46 industry respondents." }
  - { name: "Locally grown and made, on-shore supply chain", cls: C, users: [P, O], src: [U, P], note: "Little effect on renters. Rated highly valued by 12 of 46 industry respondents." }
  - { name: "Regional culture, heritage and cultural resonance", cls: C, users: [P, O], src: [U, P], note: "Did not resonate with renters. Rated highly valued by 13 of 46 industry respondents." }
  - { name: "Identity, brand and value signaling", cls: C, users: [O, I], src: [U, P], note: "Renters' pride attached to a distinctive building, not to self-expression. Rated highly valued by 12 of 46 industry respondents." }
  - { name: "Structural ability, durability and resilience", cls: C, users: [I, P, O], src: [J, P], note: "Residents in Finland and Sweden trusted that builders had considered durability. Rated highly valued by 15 of 46 industry respondents." }
  - { name: "Helps earn approvals and reduce local opposition", cls: C, users: [I], src: [P], note: "Valued by investors as lower entitlement risk. In the industry survey, 12 of 46 rated help with government approvals highly valued and 10 of 46 rated mitigating local opposition highly valued." }
  - { name: "Aligned with forest management needs", cls: C, users: [P], src: [P], note: "Rated highly valued by 7 of 46 industry respondents." }
  - { name: "Support for rural jobs and revitalization", cls: C, users: [P], src: [P], note: "Rated highly valued by 9 of 46 industry respondents." }
  - { name: "National security alignment", cls: C, users: [P], src: [P], note: "Rated highly valued by 3 of 46 industry respondents." }
  - { name: "Fulfills ESG investment mandates", cls: C, users: [I], src: [P], note: "Rated highly valued by 7 of 46 industry respondents." }
baseline: >-
  Non-mass timber related attributes are held outside of this taxonomy. For example, with apartments, location, floor plan and price remain the standard search attributes for any home. For industrial assets, proximity to nodes (ports, industry clusters) along with column spacing, clear height, etc. are tier one attributes. Mass timber's attributes are weighed afterwards, not instead of them.
discussion_heading: >-
  Points for discussion
discussion:
  - title: >-
      Match the attribute to the party who can value it
    text: >-
      A carbon story told to a renter and a calm interior described to a procurement officer are both aimed at the wrong reader. Most confusion about whether mass timber "creates value" comes from pairing an attribute with an end user who cannot verify it or has no reason to pay for it.
  - title: >-
      Search and experience attributes need the wood to be seen
    text: >-
      If the structure is covered, what remains for the occupant is a credence claim about what is behind the wall. Product and design choices that keep timber exposed protect the two classes that pay in the market.
  - title: >-
      Credence attributes need an attester and a payer
    text: >-
      Unlabelled claims earn little. Where a government or institution has adopted the goal, the claim has a natural payer; elsewhere it needs a recognised label and a segment that looks for it.
  - title: >-
      Credence attributes are chosen to fit the electorate
    text: >-
      Policy-related credence attributes appeal across the political spectrum, but not all at once. A project can center the ones its voters support: a jobs story for rural voters, a lower-carbon story for urban voters.
  - title: >-
      Production advantages are a separate matter
    text: >-
      Speed, a smaller crew and a safer site are learned by building, and they lower cost or time for the producer. They belong in the pitch to an investor only when they change the investment's duration or risk.

method:
  heading: >-
    Notes and limits
  points:
    - >-
      The three classes are standard in information economics. Their application to mass timber, the placement of each attribute and the emphasis shown for each project type are the author's proposal.
    - >-
      Some attributes fit more than one class. Exposed wood is found on inspection and also lived with; it is placed under search because that is where it first acts. Speed of construction is an experience attribute to the builder and closer to a credence claim for a capital source until a track record exists.
    - >-
      The evidence is early. The renter study covers 26 households at two developments. The Finnish and Swedish study is qualitative, in buildings where the timber was mostly covered. The industry survey reports perceptions, not consumer behaviour.
    - >-
      Comment is invited on the placements and on attributes that are missing.

references:
  - >-
    Nelson, P. (1970). Information and consumer behavior. *Journal of Political Economy*, 78(2), 311–329.
  - >-
    Nelson, P. (1974). Advertising as information. *Journal of Political Economy*, 82(4), 729–754.
  - >-
    Darby, M. R., & Karni, E. (1973). Free competition and the optimal amount of fraud. *Journal of Law and Economics*, 16(1), 67–88.

