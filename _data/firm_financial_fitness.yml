# ───── TOP OF THE PAGE ─────
status: >-
  Tool released for public review
byline: >-
  Firm growth requires capital, and capital is competed for. This page offers a first version of tools to evaluate and build a firm's finance acumen.
author: >-
  Noel A. Johnson, Conrad / Old i, LLC
sponsors_line: >-
  Partnerships for development & deployment being sought.

# ───── OPENING SECTION ─────
why:
  heading: >-
    Why this work
  text:
    - >-
      Mass timber firms need capital to grow: for OpEx such as inventory and labor, and for CapEx such as equipment, capacity and quality. Capital is an input, allocated competitively and priced at market rates like labor or materials. Every lender, investor, grant-maker and agency is choosing between a mass timber firm and someone or something else seeking funding.
    - >-
      An [Industry Structure](/industry-structure) analysis helps contextualize the setting these firms compete in: strong substitutes, powerful suppliers and an industry whose attractiveness to capital can be improved. Even so, a firm’s difficulty raising money is often its own: explaining the market opportunity and the financial plan in the language capital providers use.
    - >-
      The author’s observation underlying this work is that mass timber benefits from world-class engineering, forestry, manufacturing and construction expertise. But less acumen at world-class levels is found across capital markets and consumer considerations. Fewer firms have staff trained in finance, strategy and marketing to the level capital providers are used to meeting.
    - >-
      In response, this work demonstrates practical tools: a first version, for public use and comment, of mechanisms intended to improve financial fitness at the firm level. It is built to be used, with a self-evaluation to score and a guide to follow. It is not a paper to read.

# ───── THE CEMEX OBSERVATION ─────
observation:
  label: >-
    An observation from the author
  text: >-
    The 600-seat main auditorium at Stanford Graduate School of Business is the CEMEX Auditorium, in Zambrano Hall. The school lists Lorenzo Zambrano, a 1968 MBA graduate who led CEMEX, and the company itself among the lead donors to its campus. From this, one can see an illustration of how the cement and concrete industry has for years invested in its people across business and finance, and not only in engineering, manufacturing and construction. Mass timber competes with that industry for market share and may benefit from similar acumen. [Stanford GSB, 2011](https://www.gsb.stanford.edu/experience/news-history/stanford-graduate-school-business-opens-its-new-home)

# ───── WHAT CAPITAL ASKS IN RETURN FOR ITS USE ─────
exchange:
  heading: >-
    What capital asks in return for its use
  text:
    - >-
      To use another party’s capital, a firm must share one or a combination of three things. Firms seeking growth capital often stall on this fundamental.
  three:
    - label: >-
        One
      title: >-
        A share of future cash flows
      text: >-
        Loan: Interest and repayment to a lender. Equity: distributions to an investor.
    - label: >-
        Two
      title: >-
        A share of future asset value
      text: >-
        A claim on the business or project value to be created; shared asset ownership.
    - label: >-
        Three
      title: >-
        Shared governance
      text: >-
        Limits on the firm’s freedom to decide: covenants, board seats, approval rights and reporting.
  table_headings:
    - >-
      Kind of capital
    - >-
      Cash flows
    - >-
      Asset value
    - >-
      Governance
  table:
    -
      - >-
        Bank or other senior debt
      - >-
        A fixed, first claim on cash flows
      - >-
        Security via assets, but no share of its growth
      - >-
        Covenants and reporting
    -
      - >-
        Equity
      - >-
        A non-fixed, secondary claim on cash flows
      - >-
        Ownership of the assets and a share of their growth
      - >-
        Board seats, approval rights, full transparency
    -
      - >-
        Mission-driven or concessionary capital
      - >-
        A reduced or flexible claim on cash flows
      - >-
        Sometimes a share, often none
      - >-
        Mission conditions and impact reporting
    -
      - >-
        Public grants, contracts and incentives
      - >-
        Usually none, though pursuing it has political costs
      - >-
        Usually none
      - >-
        Eligibility, compliance and reporting, sometimes repayment if commitments are missed
  note: >-
    Typical patterns, for orientation. Actual terms vary by provider and by deal.

# ───── VISUALIZING CAPITAL FLOWS ─────
channels:
  heading: >-
    Six channels of capital
  text:
    - >-
      Capital flows into the mass timber industry through six channels: three kinds of source, each funding two kinds of asset. A third dimension, risk, runs through all six. A firm that is fit to compete knows which channel suits its next need, and what that channel expects in return.
  block_note: >-
    The block is two wide, three high and two deep. Its depth is risk: within every channel some providers fund what is new and novel, and others fund only what is proven and predictable. Which is which, for mass timber, is left open on purpose. Each firm maps it for itself, using the guide that follows.
  detail_label: >-
    The six channels in detail
  columns:
    - title: >-
        Source
      sub: >-
        
    - title: >-
        Financial assets
      sub: >-
        Firms, IP, tech
    - title: >-
        Real assets
      sub: >-
        Bldgs, land, PP&E
  sources:
    - name: >-
        Market
      who: >-
        Firms and persons seeking a market return
      financial:
        - >-
          Equity: ownership in the firm
        - >-
          Debt: loans to the firm
      real:
        - >-
          Equity: ownership of the asset
        - >-
          Debt: loans secured by the asset
    - name: >-
        Philanthropic
      who: >-
        Foundations and individuals seeking a mission outcome
      financial:
        - >-
          Grants and donations
        - >-
          Mission-driven or concessionary capital
      real:
        - >-
          Grants and donations
        - >-
          Mission-driven or concessionary capital
    - name: >-
        Public
      who: >-
        Municipalities, ports and agencies seeking a public benefit
      financial:
        - >-
          Grants and contracts
        - >-
          Subsidies and tax relief
      real:
        - >-
          Grants and contracts
        - >-
          Subsidies and tax relief

# ───── WAYFINDING ─────
wayfinding:
  heading: >-
    Wayfinding: which pool of capital do you seek to swim in?
  text:
    - >-
      Money is already flowing through each of the six channels. A firm’s task is to divert some of that flow toward itself, which starts with knowing which pool it belongs in. Five questions locate it.
  questions:
    - question: >-
        What is the money for?
      text: >-
        The firm itself, its people and technology (financial assets), or a building, a line or a machine (real assets).
    - question: >-
        How large is it, relative to your track record?
      text: >-
        A step of the same size as past borrowing, or an order of magnitude beyond it.
    - question: >-
        How proven is the item consuming the added capital?
      text: >-
        More of what already works, or something new to the firm or to the market.
    - question: >-
        What can comfortably be shared in exchange?
      text: >-
        Cash flows, asset value, governance, and how much of each.
    - question: >-
        Markets: Where does the capital want to go?
      text: >-
        The countries, regions and property types institutional investors are allocating to, and whether your customers are there.
  table_headings:
    - >-
      If the need is…
    - >-
      The pool is likely…
    - >-
      Channel
    - >-
      Expect to give
  table:
    - need: >-
        Added capacity on an existing production line
      pool: >-
        A regional or commercial bank loan, secured by the existing plant and equipment
      channel: >-
        2
      give: >-
        Fixed cash flows, security over the assets, covenants
    - need: >-
        Working capital for inventory and receivables
      pool: >-
        A bank line of credit to the firm
      channel: >-
        1
      give: >-
        Fixed cash flows, covenants, regular reporting
    - need: >-
        Equity an order of magnitude larger than anything the firm has raised
      pool: >-
        Private equity or venture capital
      channel: >-
        1
      give: >-
        A share of cash flows and of value, and real governance: board seats and approval rights
    - need: >-
        A new plant or building that brings jobs or other public benefit to a place
      pool: >-
        Public incentives, tax credits, port or municipal participation
      channel: >-
        6
      give: >-
        Commitments on location, jobs and timing, with compliance reporting
    - need: >-
        Research, testing or a first-of-its-kind demonstration
      pool: >-
        Public or philanthropic grants
      channel: >-
        3 5
      give: >-
        Conditions on use, open results, reporting
    - need: >-
        A project with a mission outcome whose return falls short of the market’s
      pool: >-
        Mission-driven or concessionary capital, often alongside private capital
      channel: >-
        4
      give: >-
        A patient claim on cash flows, mission conditions, impact reporting
  note: >-
    Illustrative routes, not advice on any particular financing. Each pool also calls for a different person to carry the conversation: a return forecast for one, a political conversation for another, risk mitigation or reporting for a third. A firm reaches a provider in one of four ways: its leaders know them, it works with those who do, it pays an intermediary, or it pays for a guarantee.

# ───── INTERNATIONAL SIDENOTE ─────
sidenote:
  label: >-
    Sidenote · The mass timber industry is international
  before:
    - >-
      Much of this discussion assumes a United States market and mindset. But institutional real estate capital is global, just like mass timber adoption. Meketa’s November 2026 primer on international core real estate offers helpful context; for example, that roughly 40% of global private real estate fund assets sit outside North America, mostly in Europe and Asia Pacific. Its Figures 2 and 3 show where open-end core funds hold their assets. In Europe, eight countries make up 86% of the composite, led by Germany at 23% and followed by France, the Netherlands, Spain, the United Kingdom, Italy, Poland and Sweden. In Asia Pacific, Japan and Australia each hold more than 30%.
    - >-
      Several of those countries are also places where mass timber building has gained traction. That overlap is the point. A financially savvy firm lets capital flows inform where it looks for customers, and asks itself:
  questions:
    - >-
      Where is mass timber adoption growing, and where does institutional real estate capital want to go?
    - >-
      Do the two overlap in the markets where we are seeking customers?
    - >-
      Do we hold this knowledge inside the firm, or have advisers who can guide us?
  after: []
  source: >-
    Source: S. Maynard, L. Giordano and R. Ranade, [*International Core Real Estate Primer*](https://meketa.com/wp-content/uploads/2026/11/MEKETA_International-Real-Estate.pdf), Meketa Investment Group, November 2026, Figures 2 and 3 (Global ODCE country breakdowns as of June 30, 2026).

# ───── THE ONE-HOUR PROGRAM ─────
program:
  heading: >-
    A proposed one-hour program
  text:
    - >-
      A session for the leaders of firms across mass timber's supply side: producers, fabricators, engineers, architects, contractors and developers; be it in person or online.
  agenda:
    - time: >-
        0 – 5 min
      title: >-
        Why capital is competed for
      text: >-
        The industry’s structure, and who else is asking the same providers for money.
    - time: >-
        5 – 15 min
      title: >-
        What capital asks in return
      text: >-
        Cash flows, asset value and governance, and how each kind of capital combines them.
    - time: >-
        15 – 25 min
      title: >-
        Six channels and wayfinding
      text: >-
        Each leader places the firm’s next need in a channel.
    - time: >-
        25 – 45 min
      title: >-
        Self-evaluation
      text: >-
        Each leader scores the firm on the ten fundamentals below.
    - time: >-
        45 – 55 min
      title: >-
        Know it, or have it on staff
      text: >-
        Discussion of the lowest scores: learn it, hire it or retain an adviser.
    - time: >-
        55 – 60 min
      title: >-
        One next step
      text: >-
        Written down, with a name and a date.

# ───── SELF-EVALUATION (the ten fundamentals and their three levels) ─────
rubric:
  heading: >-
    Self-evaluation: ten fundamentals
  text:
    - >-
      The fundamentals follow the disciplines that make up the first-year MBA curriculum at leading business schools, among them [Stanford Graduate School of Business](https://www.gsb.stanford.edu/programs/mba/academic-experience/curriculum/first-year-curriculum) and [Harvard Business School](https://www.hbs.edu/mba/academic-experience/curriculum): accounting, finance, data and decisions, economics, marketing, operations, strategy, strategy beyond markets, and organizational behavior and leadership. The tenth draws them together as a capital strategy. A leader does not need to master each one personally. The firm needs each one either known at the top or held by someone on staff or on retainer.
  instruction: >-
    Choose the description closest to your firm today. Nothing you select leaves your browser.
  basis_note: >-
    The disciplines are those of the schools’ published first-year curricula (Stanford GSB, 2025–26 offerings; Harvard Business School, 2026–27 terms). The three levels for each, and their application to mass timber firms, are the author’s and are a draft for discussion.
  level_names:
    - >-
      Not yet
    - >-
      Developing
    - >-
      Fit
  rows:
    - name: >-
        Accounting
      about: >-
        Reading the firm's statements as a lender or investor would
      not_yet: >-
        Statements are prepared once a year, mainly for tax.
      developing: >-
        Monthly statements are produced and the leaders read them.
      fit: >-
        Timely statements an outsider can rely on, reviewed or audited, and leaders can explain every large variance.
    - name: >-
        Finance
      about: >-
        Valuing an investment and choosing how to fund it
      not_yet: >-
        Investments are decided by instinct or simple payback.
      developing: >-
        Cash flows are forecast for major investments before committing.
      fit: >-
        Leaders know the firm's cost of capital, can value the firm or a project, and can explain its mix of debt and equity.
    - name: >-
        Data and decisions
      about: >-
        Forecasting cash and testing what could go wrong
      not_yet: >-
        There is no written forecast.
      developing: >-
        An annual budget is set and compared with results.
      fit: >-
        A rolling twelve-month cash forecast is kept, with scenarios for a slow year and a lost customer.
    - name: >-
        Economics of the business
      about: >-
        Costs, pricing and competition
      not_yet: >-
        Prices are set at cost plus a margin.
      developing: >-
        Margins are known by product, project or customer.
      fit: >-
        Prices reflect the value delivered, and leaders can state where the firm stands against concrete, steel and rival producers.
    - name: >-
        Marketing
      about: >-
        Knowing who the end users are and what they value
      not_yet: >-
        The firm sells to whoever calls.
      developing: >-
        Customer groups are defined and tracked.
      fit: >-
        There is evidence of what occupants, owners and public bodies value and will pay for, and the offer is built on it.
    - name: >-
        Operations
      about: >-
        Capacity, throughput and unit cost
      not_yet: >-
        Capacity and utilization are not measured.
      developing: >-
        Utilization, lead times and unit costs are tracked.
      fit: >-
        Leaders can show how new capital changes throughput, unit cost and delivery, with the numbers behind it.
    - name: >-
        Strategy
      about: >-
        Where the firm competes and why it wins
      not_yet: >-
        There is no written plan.
      developing: >-
        A plan exists and is reviewed from time to time.
      fit: >-
        The plan states where the firm competes and why it wins, and has been tested against the industry's five forces.
    - name: >-
        Non-market forces
      about: >-
        Regulatory codes, policy, public funders and electorates
      not_yet: >-
        The firm reacts to rules and programs as they arrive.
      developing: >-
        Someone follows code changes, incentives and public programs.
      fit: >-
        The firm has working relationships with regulators, agencies and public funders, and plans around them.
    - name: >-
        Organization and leadership
      about: >-
        Who decides, and how the team performs
      not_yet: >-
        The owner decides everything.
      developing: >-
        A management team shares decisions and meets on a schedule.
      fit: >-
        Decision rights are written down, a board or advisers test them, and the firm is ready to work with outside governance.
    - name: >-
        Capitalization
      about: >-
        What the firm will give in exchange for capital
      not_yet: >-
        Leaders are unclear on the trade-offs.
      developing: >-
        Leaders have a plan for which capital and what for.
      fit: >-
        Leaders have detailed plans for cash flow, asset value and governance, and the staff to carry them out.
  empty_message: >-
    Score each of the ten fundamentals to see where the firm is fit and where to start.
  verdict_fit: >-
    The firm is close to fit: it can hold a serious conversation in most channels.
  verdict_developing: >-
    The firm is developing: it can approach familiar lenders, and has work to do before larger or newer pools.
  verdict_start: >-
    The firm is at the start: build the basics before approaching new capital.

# ───── AFTER THE FIRST HOUR (half-day workout) ─────
after:
  heading: >-
    After the first hour
  text:
    - >-
      The hour locates a firm’s gaps. Closing them takes practice on the firm’s own numbers and plans. A follow-on half-day workout does that, station by station, each one framed, discussed and then applied in writing.
  expand_label: >-
    See the half-day workout
  stations:
    - label: >-
        Station 1
      title: >-
        Know who you are competing with for capital
      steps:
        - step: >-
            Frame
          text: >-
            Capital is allocated competitively and priced against a safe alternative. A provider asks what it earns for taking your risk instead of someone else's. Industry structure shows where bargaining power sits and why that question is hard for mass timber today.
        - step: >-
            Discuss
          text: >-
            Who else is asking the same provider for money, and why would it choose you?
        - step: >-
            Apply
          text: >-
            Write the case for your firm in two sentences, in the provider's terms, not the product's.
    - label: >-
        Station 2
      title: >-
        The three levers of value
      steps:
        - step: >-
            Frame
          text: >-
            Every investment case reaches value through one of three levers: the income it produces, the cost to create it, or the return required for its risk. Price is not cost. A cost that also adds risk, even perceived risk, grows in steps and not in a straight line, which is why the team matters as much as the product.
        - step: >-
            Discuss
          text: >-
            Which lever does your product or project move, and what evidence would a stranger accept?
        - step: >-
            Apply
          text: >-
            List the claims you make about mass timber. Mark each against a lever. Strike the ones that reach none.
    - label: >-
        Station 3
      title: >-
        Know your end users
      steps:
        - step: >-
            Frame
          text: >-
            Without a market there is no price signal, and without a price signal an attribute has only potential value. Mass timber answers to three end users: occupants, the savers and investors who own the asset, and the civic and political interests that permit and promote it.
        - step: >-
            Discuss
          text: >-
            Which projects predominate in your market, and which end user were they responding to?
        - step: >-
            Apply
          text: >-
            Name your end user in each of the three groups, and what each one pays with: rent, capital or approval.
    - label: >-
        Station 4
      title: >-
        Your numbers, in their language
      steps:
        - step: >-
            Frame
          text: >-
            Capital providers read the same few things in any firm: how cash moves through the year, what the money will be used for and how it comes back, how much new capital the firm can put to productive use, who decides, and whether the reporting is timely and clear.
        - step: >-
            Discuss
          text: >-
            What would a lender or investor ask first that you could not answer today?
        - step: >-
            Apply
          text: >-
            List the three documents you would need to produce within thirty days of a serious conversation, and who in your firm would produce them.
    - label: >-
        Station 5
      title: >-
        Choose your channel
      steps:
        - step: >-
            Frame
          text: >-
            Each of the six channels has its own costs, timelines and expectations, some written and some not, and each asks for a different mix of cash flows, asset value and governance.
        - step: >-
            Discuss
          text: >-
            What capital do you use now, for operations and for long-lived assets, and what do you need next?
        - step: >-
            Apply
          text: >-
            Place your next request in one of the six channels. Mark it higher or lower risk. Name the person who will carry it, and two comparable deals a provider would recognise.
    - label: >-
        Close
      title: >-
        The room is the panel
      steps:
        - step: >-
            Share
          text: >-
            There is no outside panel. Participants report what they found at each station, so that every firm learns from the others.
        - step: >-
            Leave with
          text: >-
            A one-page capital plan: the channel, the request, the evidence still missing, and the next step with a date.

