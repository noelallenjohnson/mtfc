status: >-
  Tool released for public review
byline: >-
  Mass timber's supporters have subsidized cost. This tool tests assuring income instead, so that a modest fund can stand behind larger, market-rate developments.
author: >-
  Noel A. Johnson, Conrad / Old i, LLC
partners_line: >-
  Partnerships for development & deployment being sought.

why:
  heading: >-
    Why assure income and not subsidize cost
  text:
    - >-
      Institutional investors and their lenders are not against mass timber. They are unsure of it. That uncertainty sits in one place in the proforma: the forecast of net operating income (NOI).
    - >-
      The uncertainty is greatest when a new product goes into an asset with a very long economic life that is costly to correct. A $100 million apartment building is expected to hold economic value for a century or more, where a phone is expected to hold it for three to five years, and a remodel is expensive.
    - >-
      NOI is also where a dollar matters most. A building is valued by dividing its NOI by a capitalization rate, so at a 6% cap rate each dollar of annual NOI is worth about $16.67 of value. A dollar of cost is worth a dollar.
    - >-
      Advocacy, funding and industry groups that want mass timber housing adopted by market-rate institutional capital have mostly paid down cost. The same $5 or $10 million, placed behind forecast income, can reach larger and more visible developments, the kind that change what developers and investors believe is normal.

how:
  heading: >-
    How the mechanism works
  steps:
    - title: >-
        A funder makes a pledge
      text: >-
        For example $10 million, placed in an interest-bearing account held by a third-party surety.
    - title: >-
        Projects are assured
      text: >-
        One at a time, every several months. For each, the fund stands behind the top slice of forecast NOI through lease-up and the first stabilized year.
    - title: >-
        Shortfalls are topped up
      text: >-
        If NOI falls short of forecast, the fund pays the difference, up to the limit. The investor and the bank see steadier cash flow.
    - title: >-
        Proceeds replenish the fund
      text: >-
        At sale or refinance, once investors have their preferred return, profit above it repays the top-ups. The fund gets back no more than it paid, and the money goes on to the next project.

tool:
  heading: >-
    Test the flywheel
  text:
    - >-
      A pledge that is repaid and reused is a flywheel. Set the pledge, the assurance and the spread of outcomes. The tool simulates 2,000 possible futures over fifteen years and shows how many projects the pledge backs, what it is expected to pay out and get back, and whether the flywheel holds its size or tapers.
  project_caption: >-
    The two income years of one project, drawn as a share of forecast so the top slice is visible. The dark line is forecast NOI and the gold cap is the slice the fund assures. The whisker beside each bar spans four in five simulated outcomes. The dot is one outcome, with a gold bar where the fund tops it up.
  portfolio_caption: >-
    One simulated run of the program. Gold bars are top-ups paid to a project. Green bars are what that project repays after its investors' preferred return. A project never repays more than it received.
  fund_caption: >-
    The fund's balance over fifteen years. The solid line is the middle outcome and the band covers four in five. The dotted line is the part held against projects that are still active.

assumptions:
  heading: >-
    What the tool assumes
  points:
    - >-
      Each project takes four years from the fund's commitment: two of construction, one of lease-up and one stabilized, then a sale or refinance.
    - >-
      Each project resembles a roughly 200-unit, $77 million market-rate apartment building, 55% financed by a bank loan, with a year-one unleveraged yield of about 6%. These can be changed under "Project baseline".
    - >-
      The middle project returns about 14% a year to its investors, leveraged and net of transaction costs. How far results spread below and above that is set separately for bad and good outcomes.
    - >-
      The fund commits to a new project only when it can cover that project's largest possible claim on top of those already active, so it can never run short on a promise.
    - >-
      A building that leases below forecast tends to stay below, and projects finishing in the same year share some of their fortunes through the market.
    - >-
      The spread of outcomes is a placeholder. It is the reader's to make more or less conservative until it is calibrated against published REIT results and open-end core fund (ODCE) data.
  note: >-
    An illustration for discussion, not an offer, a commitment or advice on any financing.

partnerships:
  heading: >-
    Partnerships for further development and deployment
  text:
    - >-
      This is a first version of the tool. The next steps are to calibrate it against market data, test the terms with institutional investors, lenders and sureties, and pilot it on a small set of blue-ribbon developments.
  button: >-
    Discuss a partnership →

