status: >-
  Tool released for public review
byline: >-
  Support for mass timber development has mostly taken the form of cost subsidy. This page presents the author's proposed alternative, assuring cash flow, with a tool to test how far each pledged dollar might reach.
author: >-
  Noel A. Johnson, Conrad / Old i, LLC
partners_line: >-
  Partnerships for development & deployment being sought.

intro: >-
  The method is proposed by its author as a market intervention, not advocacy. It is a technical financial tool that responds to technical factors, chiefly risk. Its mechanism is the **Mass Timber Cashflow Assurance Mechanism**, created and proposed here by the author. MTFC publishes it for public review and comment; publication is not an endorsement.

why:
  heading: >-
    The author's reasoning: why assure income and not subsidize cost
  text:
    - >-
      Institutional capital sources and their lenders are not against mass timber. They are unsure of the outcomes enabled. Capital markets hold no prejudice against the material, but uncertainty alone leads them to assign it higher risk. That uncertainty sits in one place in the proforma: the forecast of net operating income (NOI).
    - >-
      The uncertainty is greatest when a new product goes into an asset with a very long economic life that is costly to correct. A $100 million apartment building is expected to hold economic value for a century or more, where a phone is expected to hold it for three to five years, and a remodel is expensive.
    - >-
      NOI is also where a dollar matters most. A building is valued by dividing its NOI by a capitalization rate, so at a 6% cap rate each dollar of annual NOI is worth about $16.67 of value. A dollar of cost is worth a dollar.
    - >-
      Advocacy, funding and industry groups that want mass timber housing adopted by market-rate institutional capital have mostly paid down cost. The same $5 or $10 million, placed behind forecast income, could reach larger and more visible developments, the kind that may inform what the market regards as normal.

how:
  heading: >-
    How the Mass Timber Cashflow Assurance Mechanism works
  steps:
    - title: >-
        A funder makes a pledge
      text: >-
        For example $10 million, held in U.S. Treasuries at a money-center bank that supplies cash when a top-up is due. This would be in partnership with one or two blue-ribbon investment allocation firms, aligned to their existing investment strategies.
    - title: >-
        Projects are assured
      text: >-
        One at a time, every several months. For each, the mechanism stands behind the top slice of forecast NOI for the first three to five years after delivery: lease-up, stabilization, and one to three years of normal operations. This sizing would be at the deal level, per the LP investor's and the administrator's underwriting.
    - title: >-
        Shortfalls are topped up
      text: >-
        If actual NOI falls short of forecast, the mechanism pays the difference in arrears, up to the limit. The investors and the lender realize forecast cash flow; IRRs are improved by superior near-term cash flows, and discount rates are relaxed by lower deal-level risk.
    - title: >-
        Surplus proceeds replenish the mechanism
      text: >-
        At sale or permanent refinance, top-ups can be repaid if excess proceeds are generated, which is to say if money remains after the return of the loan and the equity and the payment of market-rate preferred returns, but before the GP / LP / sponsor excess-proceeds waterfall splits per industry norms. Any funds returned support the next project. After twenty years of market support, unused or remaining capital returns to the funder, up to the amount pledged, as the mechanism is retired.

measures:
  heading: >-
    Three ways to judge the mechanism
  text: >-
    The mechanism can be judged on three separate measures. Charitable leverage: how much private capital each pledged dollar stands behind. Efficiency without distortion: how small the implied subsidy is as a share of a project's cost. Visible impact: how many projects and new homes result.

tool:
  heading: >-
    Test the Mechanism
  text:
    - >-
      A pledge that is repaid and reused is a flywheel. The mechanism's aim is not to make money. It is to use the pledge to bring about the most new mass timber homes. Set the pledge, the assurance and the spread of outcomes. The tool simulates 2,000 possible futures: twenty years of new commitments, then the return of the money to the funder. The three measures above and the four charts below adjust as the sliders move.
  project_caption: >-
    The assured years of one project, drawn as a share of each year's forecast so the top slice is visible. The dark line is forecast NOI and the gold cap is the slice the mechanism assures. The whisker beside each bar spans four in five simulated outcomes. The dot is one outcome, with a gold bar where the mechanism tops it up.
  portfolio_caption: >-
    The average across all simulated futures. In the early years money only goes out. Repayments begin when the first projects are sold or refinanced, recover part of what was paid, and are recycled into new projects. After year 20 no new projects are added and the last ones run off.
  fund_caption: >-
    The balance on deposit. The solid line is the middle outcome and the band covers four in five. The dotted line is the part held against projects that are still active. After year 20 the program tapers off and money is returned to the funder as each remaining project finishes, up to the amount pledged and never more.
  deals_caption: >-
    Every project the mechanism assures across all simulated futures, placed by the NOI it achieved over the assured years. The spread of this shape is the deal-level performance being assumed. Projects left of the forecast line draw on the mechanism; colour shows whether sale or refinance proceeds were enough to repay it. Move the spread of bad outcomes to see how the shape, and what comes back to the funder, change.
  homes_caption: >-
    Homes in projects the mechanism has assured, added up from the year each project is committed.

run:
  heading: >-
    How it would be run
  points:
    - >-
      **Aimed at capital sources, not project developments.** The assurance is arranged with blue-ribbon institutional capital sources, of the kind represented by Principal, Nuveen, Blackstone, Brookfield, QuadReal and BGO. A project development does not know whether it benefits from the assurance. That stays with the capital source's fund management and investment committee, in conversation with the administrator, which limits selection bias.
    - >-
      **An administrator the industry already trusts.** The program needs an administrator with a proven record in both institutional development and institutional capital. It reviews the lender's and the capital source's underwriting, confirms that the forecast is reasonable, and that forecast becomes the baseline the assurance is measured against.
    - >-
      **Real estate development norms are respected.** Proceeds go first to the lender, then to the equity's preferred return, then to the return of equity, then to repay the Cashflow Assurance Mechanism. Anything beyond that is shared between the general and limited partners under the project's own waterfall.
    - >-
      **The pledge sits in Treasuries.** It is held at a money-center bank, earning the 10-year U.S. Treasury yield, taken here as 5%. The bank provides liquidity when a top-up is due, secured against the holding. The interest is not a return to the funder. It is one way of measuring the money as it moves and is used: the mechanism spends it on top-ups.
    - >-
      **The funder's goal is impact.** This is philanthropy, not an investment. The funder may or may not see the funds pledged returned, and will never see more than its pledge returned. The program is managed to that end: when surplus builds beyond the pledge, it is committed to assuring additional projects, and the program tapers off after its twenty-year intervention period.
  note: >-
    The firms named are examples of the kind of capital source intended. None has reviewed or endorsed this mechanism.

assumptions:
  heading: >-
    What the tool assumes
  points:
    - >-
      Each project runs five to seven years from commitment: two of construction, then three to five assured years (one of lease-up, one of stabilization and one to three of normal operations), then a sale or refinance, when top-ups are repaid.
    - >-
      Each project resembles a roughly 200-unit, $77 million market-rate apartment building, 55% financed by a commercial bank loan amortizing over 20 years, with a year-one unleveraged yield of about 6%. These can be changed under "Project baseline".
    - >-
      The middle project returns about 14% a year on equity, leveraged and net of transaction costs. How far results spread below and above that is set separately for bad and good outcomes. Both start at 20% and can be widened, bad outcomes as far as 60%.
    - >-
      The mechanism commits to a new project only when it can cover that project's largest possible claim on top of those already active, so it can never run short on a promise. The smallest pledge offered is the amount that keeps new projects starting until the first one repays.
    - >-
      A building that leases below forecast tends to stay below, and projects finishing in the same year share some of their fortunes through the market.
    - >-
      New commitments are made for twenty years. After that, money not held against an active project is returned to the funder, up to the amount pledged.
    - >-
      Surplus is recycled. When the balance exceeds the pledge, after holding back for active projects at the loss rate the mechanism has incurred so far, by at least one project's largest possible claim, an additional project is assured. Any balance beyond the pledge at wind-down is not returned to the funder.
    - >-
      The spread of outcomes is a placeholder. It is the reader's to make more or less conservative until it is calibrated against published REIT results and open-end core fund (ODCE) data.
  note: >-
    An illustration for discussion, not an offer, a commitment or advice on any financing.

