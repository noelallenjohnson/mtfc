# Mass Timber Business Case Series: copy for /business-case-studies
# Edit the text after each "key:" freely. Keep the indentation. Text after ">-" may run over several lines.
# Each project: facts (with key proforma figures), then successes and challenges written as "Label: text".
# verdict must be one of: supported, not_supported, mixed, eased, new

status: "V1.0 published for ten projects; V2.0 reviews completed for two"
intro: >-
  Market-rate, market-bound mass timber developments, studied with a business school business-case mindset:
  what was built and where, the proforma, market performance and lessons learned.
  The initial research was completed in 2021 and 2022; V2.0 updates that benefit from what the passage of time has revealed are underway.
how_to_read: >-
  Each property summary is a short distillation by the authors. The full V1.0 case studies, with costs, rents
  and returns, are published by license via WoodWorks.
v2_note: >-
  A V2.0 review takes the V1.0 study as a fixed baseline and asks what the passage of time, market disruptions, releasing and evolving capital markets has revealed.  

groups:
  - name: For-rent housing
    ids: [ascent, intro, canyons]
  - name: For-sale housing
    ids: [barracuda]
  - name: Redevelopment and additions
    ids: [timberlofts]
  - name: Purpose-built, owner-occupied
    ids: [adohi]
  - name: Office
    ids: [deharo, clay, district, iceblocks]

projects:
  - id: ascent
    photo_credit: "C.D. Smith Construction"
    name: Ascent
    kind: tower
    type: Apartments, high-rise
    place: Milwaukee, WI
    delivered: "2022"
    facts: >-
      25 storeys and 259 apartments, with 19 storeys of mass timber over a six-storey parking podium. Total Project Costs of $130M ($502k/door) with a proforma untrended yield of 5.8% (in line with mkt norms of 6%). Capitalization: 70% LTC + 15% Mezz. The tallest timber structure in the world when built.
    successes:
      - "Strong lease-up: 45% pre-leased at completion, at top-of-market rents."
      - "Speed: About four months saved on the schedule (pandemic and shipping delays aside)."
      - "Marketing: Use of mass timber generated helpful PR / market awareness."
      - "Public: Policy alignment generated gov't support across multiple channels."
    challenges:
      - "Insurance: Cost about three times the standard rate, and lenders needed convincing."
      - "Building code: Substantial additional costs, time & expertise required to gain approvals."

  - id: intro
    photo_credit: "Nick Johnson, Tour D Space"
    name: INTRO
    kind: midrise
    type: Apartments, mixed-use
    place: Cleveland, OH
    delivered: "2022"
    facts: >-
      Nine storeys with 297 apartments, ground-floor retail and a public event space; eight storeys of mass timber over a concrete podium. Total Project Costs of $147M ($495k/door) with a proforma untrended yield of 7.0% (above mkt norms of 6.25%; realized 7.35%). Capitalization: 65% LTC, with the developer providing the equity.
    successes:
      - "Strong lease-up: 60% pre-leased and 90% leased four months after completion, at record velocity."
      - "Premium rents: The highest apartment rents in Cleveland, about 28% above market for a one-bedroom."
      - "Debt: Refinancing efforts began less than three months after opening."
      - "Public: Aligned with the city's ESG policy objectives; a tall-wood precedent for other jurisdictions and developers."
    challenges:
      - "Speed: Expected schedule savings not fully achieved; trades were new to the system and the cladding could not keep pace with the timber structure."
      - "Moisture: Laborious repairs required where water was not managed well during construction."
      - "Building code: A variance was needed to use the 2021 tall-wood code before local adoption."
      - "Cost: Higher bids from inexperienced builders, and higher design fees for early coordination of building services."

  - id: canyons
    photo_credit: "Jeremy Bittermann"
    name: The Canyons
    kind: midrise
    type: Apartments with retail
    place: Portland, OR
    delivered: "2020"
    facts: >-
      Six storeys with 70 larger-than-usual apartments, first aimed at active adults aged 55 and over; five levels of cross-laminated timber over ground-floor retail. Total Project Costs of $32M ($457k/door) with a proforma untrended yield of 5.7% (in line with mkt norms of 5.5%). Capitalization: 60% LTC.
    successes:
      - "Premium rents: A clear rent premium in a design-oriented submarket; a one-bedroom about 46% above market."
      - "Stable tenancy: The owner chose best rents over fast lease-up; slower absorption, but tenants who stay."
      - "Design: Open-air corridors showcase the timber and bring fresh air to every front door, which appealed to tenants, banks and appraisers."
      - "Spillover: Remaining condos in the neighbouring Carbon12 building sold once construction completed."
      - "Cost and speed: Built at market cost and about 10% faster (pandemic effects aside)."
    challenges:
      - "Insurance: Rates were high, and hard to separate from a rising insurance market."
      - "Retail: Required by the city but hit hardest by the pandemic; banks valued it at zero."
      - "Building code: Fire-code trade-offs made the one-storey live/work units costlier to build and harder to lease."
      - "Timing: The target clientele was largely confined to home through the pandemic."
    v2:
      date: August 2026
      basis: >-
        The building sold in August 2025 for $23.5 million to a new owner, with a new lender and a new property
        manager. An arm's-length sale turns opinion into observation, and the buyer's offering memorandum shows
        what a sophisticated sponsor believes moves investors' money.
      summary: >-
        What lasted was resilience: occupancy, differentiation and breadth of buyer interest. What faded was the
        rent premium and any awareness of the timber among those running and renting the building.
      lasting:
        - claim: More stable tenants
          verdict: supported
          text: Occupancy held above 85% through a soft market while nearby properties struggled to hold 80%. Mass timber may help cash flows survive downturns comparatively better.
        - claim: Differentiation
          verdict: new
          text: The building's distinct look and feel survived changes of owner, manager and target market. The buyer's memorandum leads with the timber atrium and the "condo quality" homes.
        - claim: Wider pool of buyers
          verdict: new
          text: Mass timber drew more interested buyers than a conventional 70-unit building would have, in a risk-off market for apartments. It was not seen to raise the price paid.
        - claim: Insurance and lender caution
          verdict: eased
          text: No adverse pricing from lenders, insurers or the broker was detected at the sale.
      fleeting:
        - claim: Premium rents
          verdict: not_supported
          text: The rent premium was not sustained. Attribution is murky; the 55-and-over focus was dropped, the Portland rental market weakened and the property manager changed. In hindsight the 2022 premium may have been earned by the product and its service more than by the timber.
        - claim: Awareness and values signalling
          verdict: new
          text: Awareness of the mass timber decays with distance from the development decision. Residents find the homes unique without knowing why, the on-site manager did not market it, and no carbon or values signalling to tenants was detected.
      unclear:
        - claim: Price paid
          verdict: new
          text: Indeterminate. The buyer's residential basis of about $310 per net square foot sits within the range of conventional comparables nearby, but recent Portland sales are few, distressed, and include no other mass timber building to compare with.
      details:
        - title: "A natural experiment: inside the offering memorandum"
          kind: bars
          intro: >-
            To raise capital for the purchase, the buyer's sponsor had to decide how much of a finite, persuasive
            document to give to each attribute of the building. That is a revealed preference. Seven standard
            appraisal attributes were coded across the memorandum's first 20 pages through three channels:
            share of page space (weighted 45%), keyword mentions (20%) and photographs (35%).
          unit: Combined score
          bars:
            - { label: "Unit design and layout", value: 23.2, page: 24.2, mention: 32.6, image: 22.1 }
            - { label: "Location and site", value: 22.6, page: 23.2, mention: 19.0, image: 29.4 }
            - { label: "Common area amenities", value: 17.6, page: 18.1, mention: 10.9, image: 25.0 }
            - { label: "Mass timber / wood", value: 14.2, page: 11.9, mention: 9.2, image: 23.5, mark: true }
            - { label: "Building program and scale", value: 9.3, page: 10.9, mention: 8.2, image: "n/a" }
            - { label: "Cost / value basis", value: 8.5, page: 7.2, mention: 13.6, image: "n/a" }
            - { label: "Construction quality (general)", value: 4.7, page: 4.4, mention: 6.5, image: "n/a" }
          takeaway: >-
            Mass timber ranks fourth of seven, about level with gyms and roof decks. It is shown far more than
            it is written about: its image score is among the highest while its page and mention scores are thin.
            Wood is seen but not yet counted in the asset arithmetic; a branding device not yet translated into a
            priced or risk-adjusted underwriting variable.
        - title: Underwriting notes
          kind: table
          head: [Mechanism, Direction, Scale and nature]
          rows:
            - ["Breadth of buyer interest", "Positive", "Small; may act on the cap rate or on a buyer's growth assumptions"]
            - ["Price paid / cap rate", "Indeterminate", "Too few comparable transactions"]
            - ["Rent premium", "Not sustained", "Small; may help lease-up and value at stabilization or refinance"]
            - ["Occupancy resilience", "Positive", "Lowers NOI volatility; improves leverage and cap rate potential"]
            - ["Stigma from lenders and insurers", "None detected", "No change to the proforma"]
            - ["Tenant values signalling (carbon / ESG)", "None detected; fades", "Helps lease-up and return to stabilization"]
      method: >-
        A before-and-after comparison against the April 2022 case study, drawing on interviews with the
        developer, the selling broker, the new owner's asset managers and the property manager, resident
        surveys, the buyer's information memorandum, public records and published market data.

  - id: barracuda
    photo_credit: "Populance"
    name: Barracuda Condos
    kind: condo
    type: Condominiums
    place: Madison, WI
    delivered: "2020"
    facts: >-
      Seven storeys with 19 two-bedroom condominiums over offices and parking; a hybrid of steel framing with glue-laminated timber floors and roof. Total Project Costs of $10.8M proforma ($452k/unit) and $11.7M realized ($524k/unit), with a proforma return on cost of 6.0% (realized 4.9%) and return on equity of 21.5% (realized 17.1%). Capitalization: 60% LTC from a local bank (66.5% realized).
    successes:
      - "Pre-sales: 75% sold at the start of construction, which enabled financing; 95% sold before completion."
      - "No walk-aways: Buyers who wavered during the pandemic all closed after seeing the nearly finished homes."
      - "Pricing: Realized sales prices about 48% above market."
      - "Local supply: Locally fabricated timber panels avoided fabricator queues, shipping cost and pandemic delays."
      - "Investors: The product is attracting new investors to the developer's next deals."
    challenges:
      - "Cost: Construction ran well above proforma ($202 vs. $153/GSF), reducing returns."
      - "Moisture: Managing moisture during construction."
      - "Lenders: Disliked the lack of parking; a smaller local bank that understood the location provided the loan."
      - "Building code: An all-timber design gave way to a steel and timber hybrid to ease approvals."

  - id: timberlofts
    photo_credit: "ADX Creative and Engberg Anderson Architects"
    name: Timber Lofts
    kind: reuse
    type: Apartments, reuse and addition
    place: Milwaukee, WI
    delivered: "2020"
    facts: >-
      60 apartments; 33 in a five-storey 1890s warehouse and 27 in a new cross-laminated timber addition beside it. Total Project Costs of $14.6M ($243k/door), supported by $2M of historic tax credits, with a proforma untrended yield of 5.5% after subsidy (in line with mkt norms of 5.5%). Capitalization: 70% LTC.
    successes:
      - "Strong lease-up: Met aggressive leasing assumptions and leased faster than comparable buildings, at top-of-market rents."
      - "Differentiation: Mass timber let the addition harmonize with the historic brick and timber building."
      - "Cost: The timber addition cost about 7% more than the market standard, countering the belief that mass timber is considerably more expensive."
      - "Spillover: A noteworthy project that lifted momentum and perceptions of the street and submarket."
    challenges:
      - "Tax credits: The $2M of historic credits came with many design requirements from the National Park Service."
      - "Insurance: Costs ran above proforma, though perhaps because of the general market."
      - "Retail: Still not leased as of October 2021."
      - "Tenants: Surveys suggest sustainability was not a priority for them."

  - id: adohi
    photo_credit: "Timothy Hursley"
    name: Adohi Hall
    kind: dorm
    type: Student housing
    place: Fayetteville, AR
    delivered: "2019"
    facts: >-
      A 708-bed living and learning community at the University of Arkansas, about 202,000 square feet. Total Project Costs of $64.1M ($90.5k/bed), of which $48.9M ($69k/bed) is residential, funded entirely from the university's auxiliary budget. Construction cost of $317/GSF against a market standard of $304/GSF. Owner-occupied, so no yield is reported.
    successes:
      - "On time and on budget: Recovered four months lost to a delayed construction start."
      - "Financing: The use of cross-laminated timber raised no concerns for the lender or its underwriting."
      - "Performance: A highly desirable housing option at top-of-market rents; hit proforma and is paying its debt."
      - "Private sector influence: Reduced fire marshal and code-official resistance for later private projects in the state."
    challenges:
      - "Cost perceptions: Steel and mass timber designs were both carried to 30% design development to prove cost-to-value."
      - "Supply chain: Timber sourced from Europe, with the contractor owning ship-to-site logistics."
      - "Design cost: Full early coordination of building services for prefabrication raised design fees and added four months of documentation."
      - "Communication: Many stakeholders with economic and non-economic goals required extra effort."

  - id: deharo
    photo_credit: "David Wakely"
    name: 1 De Haro
    kind: officeind
    type: Office and light industrial
    place: San Francisco, CA
    delivered: "2021"
    facts: >-
      Three storeys of cross-laminated timber over a concrete podium, about 134,000 square feet. The first building of its kind in San Francisco. Construction cost of $52.5M ($392/GSF, about 2% above the market standard) with a proforma untrended yield of 7.5% (in line with mkt norms of 7.6%; realized 7.6%). Capitalization: 60% LTC proforma (77% realized).
    successes:
      - "Strong lease-up: Leased at the start of construction, with multiple back-up offers above the accepted offer."
      - "Foundations: A structure 20-50% lighter than concrete saved foundation cost on poor soils."
      - "Speed: Prefabrication brought a shorter schedule and less noise in a dense urban setting."
      - "Carbon: 51% less embodied carbon than a concrete structure."
      - "Public: The City and the local Carpenters Union were engaged early and were supportive."
    challenges:
      - "Insurance: Premiums were higher, with few insurers willing to quote."
      - "Timing: The pandemic and utility delays extended the schedule and added cost."
      - "Moisture: Wet-season construction led to added cost to re-finish the wood."
      - "Detailing: Standard rated details did not yet exist and had to be developed with the code officials."

  - id: clay
    photo_credit: "Mackenzie; Christian Columbres Photography"
    name: Clay Creative
    kind: office
    type: Office
    place: Portland, OR
    delivered: "2015"
    facts: >-
      Five storeys and about 95,000 square feet, built speculatively. The first large, unsubsidized commercial mass timber office delivered in the United States. Total Project Costs of $27.25M ($356/GSF, about 9% above the market standard) with a proforma untrended yield of 7.5% (in line with mkt norms of 7.5%; realized 7.7%). Capitalization: 65% LTC (67% realized).
    successes:
      - "Strong lease-up: Better-than-market leasing velocity to creditworthy tenants at proforma rents."
      - "Speed: Fast construction let tenant fit-out run alongside the base building, bringing occupancy sooner."
      - "Occupancy: Later sub-leasing and re-leasing has been strong."
      - "Returns: A realized equity multiple of 2.0x against a market norm of 1.75x."
      - "Synergies: Underfloor services and ceiling finishes can partly offset the cost of the timber."
    challenges:
      - "Cost: The timber structure and raised-floor HVAC drove a construction premium of about 12%."
      - "Insurance: More expensive than for traditional buildings."
      - "Financing: Fewer willing lenders, as some are averse to the risk or the effort."
      - "Building code: Permitting took longer and was more complicated for new details."
      - "Construction: Subcontractors underestimated the implications; a detail-oriented general contractor was essential."
    v2:
      date: July 2026
      basis: >-
        Ten years of operation, through the strongest office market in Portland's modern history (2016 to 2019),
        a demand shock, the wind-down of an anchor tenant, and the deepest office repricing in the market's
        modern history (2022 to the present).
      summary: >-
        What lasted was protection of cash flow: the building keeps winning creditworthy tenants when the market
        is at its worst. What proved temporary was the peak-market pricing of its first years, and the benefit
        of speed turned out to be mostly one of timing.
      lasting:
        - claim: Leasing strength and credit quality
          verdict: supported
          text: A persistent advantage in turning tours into shortlists, pricing that avoided the deep concessions competitors accepted, and repeated capture of the market's scarce larger, creditworthy tenants. The value shows up as steadier cash flow more than as higher rent.
        - claim: Broad tenant appeal in a downturn
          verdict: new
          text: The wood workspace has no close substitute among competing buildings, which holds a floor under lease terms when others capitulate. It acts like a put option for the owner, paying when it is most needed, and it is not yet priced.
        - claim: Second-generation space
          verdict: new
          text: Unusually for offices, previously occupied space is seen as a better fit and finish than new space elsewhere, so the owner's earlier fit-out investment survives tenant turnover.
        - claim: Lenders and insurers
          verdict: eased
          text: The building was refinanced from a regional bank to a conservative national life insurance lender with no discount or premium for timber, and insurance effects have been minimal. Capital markets price the numbers, so any timber benefit must arrive through the cash flows.
      fleeting:
        - claim: Top-of-market rents at stabilization
          verdict: mixed
          text: It is not reasonable to separate the early outperformance from ideal timing in the office cycle. New leases are at the top of today's market, but below the rents of earlier years.
        - claim: Faster delivery
          verdict: supported
          text: Supported, with a different emphasis. Speed mattered most as a way to deliver into peak demand and to reduce risk, more than for the cost and interest savings usually cited.
        - claim: Marketing salience
          verdict: new
          text: The building was rebranded and the new positioning mentions mass timber rarely, leading with location and other fundamentals. The experiential effect on leasing persists without it.
      unclear:
        - claim: Savings from underfloor systems
          verdict: not_supported
          text: Owners and leasing brokers see no faster or cheaper tenant fit-out from the raised floor and underfloor services that the first study expected to pair well with timber.
        - claim: A condition
          verdict: new
          text: Timber multiplies strong fundamentals such as location, parking, nearby amenities and streetscape. It does not substitute for them; comparable timber buildings without those fundamentals do not show the same effects.
      details:
        - title: "A natural experiment on Clay Street"
          kind: buildings
          intro: >-
            Same market, same location, same quality, same owner, same leasing team, same four years. Different
            outcomes. With Portland office absorption persistently negative and vacancy near 22%, three adjacent
            buildings developed by the same group were offered to the same thin pool of tenants.
          buildings:
            - { name: "Clay Creative", sub: "Mass timber office, 2015", kind: office, result: "Leased", good: true, text: "New high-credit tenants at the top of current market rents." }
            - { name: "120 Clay", sub: "Mass timber office, next door", kind: office, result: "Leased", good: true, text: "New high-credit tenants at the top of current market rents." }
            - { name: "1510 Tech Center", sub: "Historic concrete reuse, adjacent", kind: reuse, result: "No replacement tenant", good: false, text: "Equal leasing effort; some features superior, including very low energy use and private protected parking." }
          takeaway: >-
            Between them the two mass timber buildings secured a grocery company's lease, a credit tenant of about
            20,000 square feet and a further 16,000 square feet under letter of intent. The comparison suggests the
            outperformance is not only a general flight to quality; it shows up at the level of the individual property.
        - title: Underwriting illustrations
          kind: table
          head: [Mechanism, Direction, Scale and nature]
          rows:
            - ["Lower-volatility cash flows", "Positive", "Improves cap rates (value) and leveraged returns"]
            - ["Broader tenant appeal", "Positive", "Improves occupancy and turnover; avoids expenses and new capital spending"]
            - ["Option value", "Positive", "Helpful for owners with flexibility on timing"]
            - ["Dovetailed building systems", "Not observed", "Avoid extra cost to maximize return"]
            - ["Faster erection", "Positive", "More for market timing than for a shorter total duration"]
            - ["Marketing", "Positive", "Sustained appeal without effort or annual expense"]
      quote: "When prospects set foot in the building, it always makes their short list."
      quote_by: President of the firm that asset-manages the building
      method: >-
        A before-and-after comparison against the original case study, drawing on interviews with the building's
        ownership and its leasing broker in July 2026 and on published market data from JLL, Nareit, NCREIF and others.

  - id: district
    photo_credit: "Hacker"
    name: District Office
    kind: office
    type: Office with retail
    place: Portland, OR
    delivered: "2020"
    facts: >-
      Six storeys and about 106,000 square feet, with a third of the office space pre-leased to the architecture firm that designed it. Total Project Costs of $40.5M ($399/GSF, about 14% above the market standard) with a proforma untrended yield of 7.2% (in line with mkt norms of 7.25%). Capitalization: 65% LTC, with equity from internal funds.
    successes:
      - "Pre-leasing: 70% pre-leased before the pandemic, anchored by the building's architect."
      - "Structural efficiency: Thinner timber panels, a repeatable connection and an industrial finish grade kept cost down."
      - "Daylight: Timber spans removed the perimeter beam, so windows reach the ceiling."
      - "Speed: Just-in-time delivery let components be lifted straight from the truck into place."
      - "Flexibility: Removable floor panels let tenants create an atrium or internal stair."
    challenges:
      - "Timing: Delivered into the pandemic; leasing of the remainder slowed."
      - "Competition: Several other office buildings reached the Central Eastside market at the same time."
      - "Building services: Routing through an exposed structure took a purpose-made solution."
      - "Returns: A proforma leveraged return of 14% against a market norm of 18%."

  - id: iceblocks
    photo_credit: "RMW Architecture & Interiors; Bernard André Photography"
    name: The ICE Blocks
    kind: officeretail
    type: Office and retail
    place: Sacramento, CA
    delivered: "Summer 2018"
    facts: >-
      A new mass timber building of about 132,000 rentable square feet, replacing a historic warehouse lost to fire within a larger reuse project. Total Project Costs of $48.5M ($367/GSF, about 3% above the market standard) with a proforma untrended yield of 7.7% (above mkt norms of 7.25%). Capitalization: 65% LTC.
    successes:
      - "Strong lease-up: Offices leased quickly while under construction, to quality tenants."
      - "Cost: Only slightly more expensive to deliver a differentiated space."
      - "Public: Limited pushback on entitlements; the city came to the table as a partner."
      - "Capital partners: Stayed with the project through the uncertainty and delays caused by the fire."
    challenges:
      - "Rents: Did not achieve above-market rents."
      - "Cost: Used the full contingency and a little more."
      - "Detailing: With everything exposed, subcontractors had to work to an aesthetic standard; capable subs were limited."
      - "Re-leasing: Demising walls are not easy to move."
      - "Commissions: Broker commissions ran about 25% above the market standard."

