# Mass Timber Finance & Consumer — site settings
title: "Mass Timber Finance & Consumer"
description: "A research-driven working group on the economics, investment and consumer demand for mass timber."
url: "https://www.masstimberfinanceconsumer.org"

# LIVE: served at www.masstimberfinanceconsumer.org (see the CNAME file). Launched Nov 23, 2026.
baseurl: ""

owner: "Old i, LLC"
