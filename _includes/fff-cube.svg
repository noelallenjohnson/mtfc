text x="199" y="332" text-anchor="end" font-size="21" font-weight="700" fill="#1a1a18">Philanthropic</text><text x="199" y="356" text-anchor="end" font-size="13.5" fill="#6b6b66">Foundations and individuals</text><text x="199" y="374" text-anchor="end" font-size="13.5" fill="#6b6b66">seeking a mission outcome</text><rect x="215" y="410" width="245" height="130" fill="#f8efdc" stroke="#1a1a18" stroke-width="1.2"/><circle cx="245" cy="442" r="15" fill="#a67c3d"/><text x="245" y="448" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text><text x="235" y="486" font-size="18" fill="#1a1a18">Grants and contracts</text><text x="235" y="512" font-size="18" fill="#1a1a18">Subsidies, tax relief</text><rect x="460" y="410" width="245" height="130" fill="#f8efdc" stroke="#1a1a18" stroke-width="1.2"/><circle cx="490" cy="442" r="15" fill="#a67c3d"/><text x="490" y="448" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6</text><text x="480" y="486" font-size="18" fill="#1a1a18">Grants and contracts</text><text x="480" y="512" font-size="18" fill="#1a1a18">Subsidies, tax relief</text><text x="199" y="462" text-anchor="end" font-size="21" font-weight="700" fill="#1a1a18">Public</text><text x="199" y="486" text-anchor="end" font-size="13.5" fill="#6b6b66">Municipalities and agencies</text><text x="199" y="504" text-anchor="end" font-size="13.5" fill="#6b6b66">seeking a public benefit</text><rect x="215" y="150" width="490" height="390" fill="none" stroke="#1a1a18" stroke-width="2"/><text x="537.5" y="26" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a18">Financial assets</text><text x="537.5" y="48" text-anchor="middle" font-size="14" fill="#6b6b66">Firms, IP, tech</text><text x="782.5" y="26" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a18">Real assets</text><text x="782.5" y="48" text-anchor="middle" font-size="14" fill="#6b6b66">Bldgs, land, PP&amp;E</text><g stroke="#a67c3d" stroke-width="2" fill="none"><