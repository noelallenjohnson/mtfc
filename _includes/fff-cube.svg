<svg class="cube" viewBox="0 0 1000 610" role="img" aria-labelledby="cube-t cube-d" font-family="Inter, system-ui, sans-serif"><title id="cube-t">Six channels of capital, with risk as depth</title><desc id="cube-d">A block three rows high and two columns wide. Rows are market, philanthropic and public sources. Columns are financial assets and real assets. The depth of the block is risk: higher risk at the front, lower risk at the back.</desc><polygon points="215,150 705,150 905,64 415,64" fill="#f7f6f3" stroke="#1a1a18" stroke-width="2" stroke-linejoin="round"/><line x1="460" y1="150" x2="660" y2="64" stroke="#1a1a18" stroke-width="1.2"/><line x1="315.0" y1="107.0" x2="805.0" y2="107.0" stroke="#a67c3d" stroke-width="1.6" stroke-dasharray="6 5"/><polygon points="705,150 905,64 905,194 705,280" fill="#d3deee" stroke="#1a1a18" stroke-width="1" stroke-opacity=".45" stroke-linejoin="round"/><polygon points="705,280 905,194 905,324 705,410" fill="#cfe5d8" stroke="#1a1a18" stroke-width="1" stroke-opacity=".45" stroke-linejoin="round"/><polygon points="705,410 905,324 905,454 705,540" fill="#eddcb8" stroke="#1a1a18" stroke-width="1" stroke-opacity=".45" stroke-linejoin="round"/><polygon points="705,150 905,64 905,454 705,540" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linejoin="round"/><line x1="805.0" y1="107.0" x2="805.0" y2="497.0" stroke="#a67c3d" stroke-width="1.6" stroke-dasharray="6 5"/><g transform="translate(755,324) rotate(-90)" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linejoin="round"><text y="-4" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1a1a18">HIGHER RISK</text><text y="18" font-size="15.5" fill="#3f4244">New, novel</text></g><g transform="translate(855,280) rotate(-90)" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-opacity=".7" stroke-width="5" stroke-linejoin="round"><text y="-4" font-size="18" font-weight="700" letter-spacing="1.5" fill="#1a1a18">